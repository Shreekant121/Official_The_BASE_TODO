  /* ================================================================
     PIECES
     ================================================================ */

  const Kicker = ({ children, color = 'var(--fg-4)', style }) => (
    <span style={{ font: 'var(--type-kicker)', letterSpacing: 'var(--tracking-kicker)', textTransform: 'uppercase', color, ...style }}>{children}</span>
  );

  /* A metric is a large mono numeral and a kicker. The system's answer
     to "this screen needs visual weight" — never a chart, never art. */
  function Metric({ value, unit, label, tone }) {
    return (
      <div style={{
        display: 'grid', gap: 'var(--sp-2)', padding: 'var(--sp-6) var(--sp-7)',
        borderRadius: 'var(--r-card)', minWidth: 0,
        backgroundImage: 'var(--glass-fill-1)', boxShadow: 'var(--glass-rim-1)',
      }}>
        <span style={{ display: 'flex', alignItems: 'baseline', gap: 'var(--sp-2)' }}>
          <span style={{
            font: 'var(--type-metric)', fontFamily: 'var(--font-mono)', fontSize: 'var(--text-3xl)',
            letterSpacing: 'var(--tracking-display)', color: tone || 'var(--fg-1)', fontVariantNumeric: 'tabular-nums',
          }}>{value}</span>
          {unit && <span style={{ font: 'var(--type-numeric)', fontSize: 'var(--text-sm)', color: 'var(--fg-3)' }}>{unit}</span>}
        </span>
        <Kicker>{label}</Kicker>
      </div>
    );
  }

  function Chip({ label, icon, on, count, onClick }) {
    const [hover, setHover] = React.useState(false);
    return (
      <button type="button" onClick={onClick} aria-pressed={on}
        onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
        style={{
          display: 'inline-flex', alignItems: 'center', gap: 'var(--sp-3)', height: 38, flex: '0 0 auto',
          padding: '0 var(--sp-5)', border: 0, cursor: 'pointer', borderRadius: 'var(--r-pill)',
          backgroundImage: on ? 'var(--glass-fill-solid)' : hover ? 'var(--glass-fill-2)' : 'var(--glass-fill-1)',
          boxShadow: on ? 'var(--glass-rim-3), var(--glass-cast-1)' : hover ? 'var(--glass-rim-2)' : 'var(--glass-rim-1)',
          color: on ? 'var(--fg-on-light)' : 'var(--fg-2)', font: 'var(--type-label)',
          transition: 'var(--t-hover)',
        }}>
        {icon && <span style={{ display: 'flex', opacity: on ? 0.7 : 1, color: on ? 'inherit' : 'var(--fg-3)' }}><Icon name={icon} size={15} /></span>}
        {label}
        {count != null && (
          <span style={{
            font: 'var(--type-kicker)', letterSpacing: 'var(--tracking-kicker)',
            color: on ? 'var(--fg-on-light)' : 'var(--fg-4)', opacity: on ? 0.6 : 1, fontVariantNumeric: 'tabular-nums',
          }}>{count}</span>
        )}
      </button>
    );
  }

  /* One line of the log. The time is mono and fixed-width so the column
     reads as a ruler; the row expands in place to show the exact call,
     because "read what it did afterwards" is the whole point of §5.3. */
  function Row({ entry, reverted, last }) {
    const [open, setOpen] = React.useState(false);
    const [hover, setHover] = React.useState(false);
    const dead = reverted || entry.reverted;

    const tone = entry.front ? 'var(--status-review)'
      : entry.tone === 'review' ? 'var(--status-review)'
      : entry.readOnly ? 'var(--fg-3)'
      : 'var(--accent)';

    return (
      <div style={{ borderTop: last ? 'none' : '1px solid var(--line-faint)' }}>
        <button type="button" onClick={() => setOpen(!open)} aria-expanded={open}
          onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
          style={{
            display: 'grid',
            gridTemplateColumns: 'auto auto minmax(0,1fr) auto auto',
            alignItems: 'center', gap: 'var(--sp-5)', width: '100%', minHeight: 56,
            padding: 'var(--sp-4) var(--sp-6)', border: 0, cursor: 'pointer', textAlign: 'left',
            background: hover ? 'oklch(1 0 0 / 0.035)' : 'transparent',
            opacity: dead ? 0.5 : 1,
            transition: 'background var(--dur-fast) var(--ease-glass), opacity var(--dur-base) var(--ease-glass)',
          }}>
          <span style={{
            font: 'var(--type-numeric)', fontSize: 'var(--text-xs)', color: 'var(--fg-4)',
            fontVariantNumeric: 'tabular-nums', flex: '0 0 auto',
          }}>{entry.at}</span>

          <span style={{ display: 'flex', color: dead ? 'var(--fg-4)' : tone, flex: '0 0 auto' }}>
            <Icon name={dead ? 'undo-2' : entry.icon} size={16} />
          </span>

          <span style={{ display: 'grid', gap: 1, minWidth: 0 }}>
            <span style={{
              font: 'var(--type-body)', fontSize: 'var(--text-sm)', color: dead ? 'var(--fg-3)' : 'var(--fg-1)',
              whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              textDecoration: dead ? 'line-through' : 'none', textDecorationColor: 'var(--fg-4)',
            }}>
              <span style={{ color: 'var(--fg-3)' }}>{entry.what} · </span>{entry.subject}
            </span>
            <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
              {entry.meta}
            </span>
          </span>

          {entry.front
            ? <StatusPill status="review" size="sm" dot={false}>no undo</StatusPill>
            : entry.readOnly
              ? <Kicker style={{ flex: '0 0 auto' }}>read</Kicker>
              : <Kicker color={dead ? 'var(--fg-4)' : 'var(--accent)'} style={{ flex: '0 0 auto' }}>{dead ? 'undone' : 'wrote'}</Kicker>}

          <span style={{ display: 'flex', color: 'var(--fg-4)', flex: '0 0 auto', transform: open ? 'rotate(180deg)' : 'none', transition: 'transform var(--dur-base) var(--ease-morph)' }}>
            <Icon name="chevron-down" size={15} />
          </span>
        </button>

        <div style={{ display: 'grid', gridTemplateRows: open ? '1fr' : '0fr', transition: 'grid-template-rows var(--dur-morph) var(--ease-morph)' }}>
          <div style={{ overflow: 'hidden', minHeight: 0 }}>
            <div style={{ padding: '0 var(--sp-6) var(--sp-6) calc(var(--sp-6) + 62px)' }}>
              <pre className="ag-code">{entry.detail}</pre>
            </div>
          </div>
        </div>
      </div>
    );
  }

  /* A turn: what was asked, everything it caused, one revert. The card
     IS the revert unit, exactly as it is inside the Atlas transcript —
     the same contract has to look the same in both places. */
  function Turn({ turn, entries, reverted, onRevert }) {
    const wrote = entries.filter((e) => e.undoable).length;
    const front = entries.some((e) => e.front);
    const byYou = turn.actor === 'you';

    return (
      <div style={{
        borderRadius: 'var(--r-card)',
        backgroundImage: reverted ? 'var(--glass-fill-1)' : 'var(--glass-fill-2)',
        backdropFilter: 'var(--glass-bd-md)', WebkitBackdropFilter: 'var(--glass-bd-md)',
        boxShadow: reverted ? 'var(--glass-rim-1), var(--glass-cast-1)' : 'var(--glass-rim-2), var(--glass-cast-2)',
        transition: 'var(--t-hover)',
      }}>
        <header style={{
          display: 'flex', alignItems: 'flex-start', gap: 'var(--sp-5)', flexWrap: 'wrap',
          padding: 'var(--sp-6) var(--sp-6) var(--sp-5) var(--sp-6)',
        }}>
          <span style={{
            display: 'grid', placeItems: 'center', width: 30, height: 30, marginTop: 1, flex: '0 0 auto',
            borderRadius: '50%',
            backgroundImage: byYou ? 'var(--glass-fill-2)' : 'var(--glass-tint-accent)',
            boxShadow: 'var(--glass-rim-2)',
            color: byYou ? 'var(--fg-3)' : 'oklch(0.93 0.07 162)',
          }}>
            <Icon name={byYou ? 'user' : 'sparkles'} size={15} />
          </span>

          <div style={{ display: 'grid', gap: 'var(--sp-2)', flex: 1, minWidth: 200 }}>
            {turn.ask ? (
              <p style={{ font: 'var(--type-body)', fontSize: 'var(--text-sm)', color: 'var(--fg-1)', margin: 0, textWrap: 'pretty', maxWidth: '68ch' }}>
                “{turn.ask}”
              </p>
            ) : (
              <p style={{ font: 'var(--type-body)', fontSize: 'var(--text-sm)', color: 'var(--fg-2)', margin: 0 }}>
                You changed a setting.
              </p>
            )}
            <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)', flexWrap: 'wrap' }}>
              <Kicker>{turn.at}</Kicker>
              {turn.brain && <Kicker>{turn.brain}</Kicker>}
              {turn.cost != null && <Kicker>₹{turn.cost}</Kicker>}
              {turn.chat && (
                <a href="atlas.html" style={{ font: 'var(--type-kicker)', letterSpacing: 'var(--tracking-kicker)', textTransform: 'uppercase' }}>
                  {turn.chat}
                </a>
              )}
            </span>
          </div>

          {wrote > 0 && (reverted
            ? <Kicker style={{ marginTop: 'var(--sp-3)' }}>Reverted</Kicker>
            : <Button size="sm" variant="ghost" iconLeft={<Icon name="undo-2" size={14} />} onClick={() => onRevert(turn.id, wrote)}>
                Revert this turn
              </Button>)}
        </header>

        <div>
          {entries.map((e, i) => <Row key={e.id} entry={e} reverted={reverted && e.undoable} last={i === 0} />)}
        </div>

        {front && (
          <footer style={{
            display: 'flex', alignItems: 'center', gap: 'var(--sp-4)',
            padding: 'var(--sp-4) var(--sp-6)', borderTop: '1px solid var(--line-faint)',
          }}>
            <span style={{ display: 'flex', color: 'var(--status-review)', flex: '0 0 auto' }}><Icon name="lock" size={14} /></span>
            <span style={{ font: 'var(--type-caption)', color: 'var(--fg-3)', textWrap: 'pretty' }}>
              This turn passed the front door. Revert cannot reach it — the log records it, it does not recall it.
            </span>
          </footer>
        )}
      </div>
    );
  }

  /* ================================================================
     THE SCREEN
     ================================================================ */

  function ActionLog() {
    const [w, setW] = React.useState(window.innerWidth);
    const [scope, setScope] = React.useState('today');
    const [query, setQuery] = React.useState('');
    const [drawers, setDrawers] = React.useState([]);
    const [reverted, setReverted] = React.useState({ u3: true });
    const [toast, setToast] = React.useState(null);

    const wide = w >= 900;

    React.useEffect(() => {
      const on = () => setW(window.innerWidth);
      window.addEventListener('resize', on);
      return () => window.removeEventListener('resize', on);
    }, []);

    React.useEffect(() => {
      if (!toast) return;
      const t = setTimeout(() => setToast(null), 3400);
      return () => clearTimeout(t);
    }, [toast]);

    function toggle(id) {
      setDrawers((cur) => (cur.includes(id) ? cur.filter((x) => x !== id) : cur.concat(id)));
    }

    function revert(id, n) {
      setReverted((cur) => Object.assign({}, cur, { [id]: true }));
      setToast({ icon: 'undo-2', title: 'Turn reverted', detail: n + (n === 1 ? ' change' : ' changes') + ' put back. Reads and sent mail are untouched.' });
    }

    const q = query.trim().toLowerCase();
    const days = LOG
      .filter((d) => scope === 'all' || scope === 'week' || d.day === 'Today')
      .map((d) => Object.assign({}, d, {
        turns: d.turns.map((t) => Object.assign({}, t, {
          entries: t.entries.filter((e) =>
            (drawers.length === 0 || drawers.includes(e.drawer)) &&
            (q === '' || (e.what + ' ' + e.subject + ' ' + e.meta + ' ' + (t.ask || '')).toLowerCase().includes(q))
          ),
        })).filter((t) => t.entries.length > 0),
      }))
      .filter((d) => d.turns.length > 0);

    const all = LOG.flatMap((d) => d.turns.flatMap((t) => t.entries));
    const today = LOG[0].turns.flatMap((t) => t.entries);
    const counts = {};
    DRAWERS.forEach((dr) => { counts[dr.id] = all.filter((e) => e.drawer === dr.id).length; });
    const wroteToday = today.filter((e) => e.undoable).length;
    const spend = LOG[0].turns.reduce((n, t) => n + (t.cost ? parseFloat(t.cost) : 0), 0);
    const irreversible = all.filter((e) => e.front).length;
    const nothing = days.length === 0;

    const navItems = NAV.map((n) => ({ value: n.value, label: n.label, icon: <Icon name={n.icon} size={20} />, badge: n.badge }));
    function go(v) { const it = NAV.find((n) => n.value === v); if (it && it.href) location.href = it.href; }

    return (
      <div style={{ display: 'flex', height: '100vh', alignItems: 'stretch' }}>
        <GlassFilters />

        {wide && (
          <div style={{ position: 'sticky', top: 0, alignSelf: 'flex-start', flex: '0 0 auto', padding: 'var(--sp-9) 0 var(--sp-9) var(--sp-7)' }}>
            <MiniNav orientation="vertical" items={navItems} value="log" onChange={go} />
          </div>
        )}

        <div style={{
          flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', minHeight: 0, boxSizing: 'border-box',
          padding: wide ? 'var(--sp-9) var(--gutter-page) var(--sp-8)' : 'var(--sp-8) var(--gutter-page-sm) 116px',
        }}>
          <header style={{ width: '100%', maxWidth: 1000, margin: '0 auto', flex: '0 0 auto', display: 'grid', gap: 'var(--sp-7)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-5)', flexWrap: 'wrap' }}>
              <div style={{ display: 'grid', gap: 'var(--sp-2)', flex: 1, minWidth: 220 }}>
                <Kicker color="var(--fg-3)">Everything Atlas has done</Kicker>
                <h1 style={{ font: 'var(--type-display)', fontSize: 'var(--text-2xl)', letterSpacing: 'var(--tracking-title)', color: 'var(--fg-1)', margin: 0 }}>
                  Action log
                </h1>
              </div>
              <SegmentedControl size="sm" options={SCOPES} value={scope} onChange={setScope} />
              <a href="atlas.html" style={{ display: 'flex', border: 0 }}>
                <Button size="sm" variant="glass" iconLeft={<Icon name="sparkles" size={15} />}>Back to Atlas</Button>
              </a>
            </div>

            {/* Four readings, not a dashboard. The one that matters is
                the last: acts that cannot be taken back. */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(168px, 1fr))', gap: 'var(--sp-4)' }}>
              <Metric value={today.length} label="entries today" />
              <Metric value={wroteToday} label="writes, all undoable" tone="var(--accent)" />
              <Metric value={'₹' + spend.toFixed(2)} label="spent today" />
              <Metric value={irreversible} label="through the front door" tone="var(--status-review)" />
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)', flexWrap: 'wrap' }}>
              <div style={{ flex: '1 1 240px', minWidth: 200, maxWidth: 340 }}>
                <Input value={query} onChange={(e) => setQuery(e.target.value)}
                  placeholder="Search the log" aria-label="Search the log"
                  iconLeft={<Icon name="search" size={16} />} />
              </div>
              {DRAWERS.map((dr) => (
                <Chip key={dr.id} label={dr.label} icon={dr.icon} count={counts[dr.id]}
                  on={drawers.includes(dr.id)} onClick={() => toggle(dr.id)} />
              ))}
              {(drawers.length > 0 || q) && (
                <Button size="sm" variant="ghost" iconLeft={<Icon name="x" size={14} />}
                  onClick={() => { setDrawers([]); setQuery(''); }}>Clear</Button>
              )}
            </div>
          </header>

          <div className="ag-scroll" style={{ flex: 1, minHeight: 0, overflowY: 'auto', overscrollBehavior: 'contain', marginTop: 'var(--sp-9)' }}>
            <div style={{ width: '100%', maxWidth: 1000, margin: '0 auto', display: 'grid', gap: 'var(--sp-11)', paddingBottom: 'var(--sp-11)', boxSizing: 'border-box' }}>
              {nothing ? (
                <div style={{ display: 'grid', justifyItems: 'center', gap: 'var(--sp-5)', padding: 'var(--sp-14) 0', textAlign: 'center' }}>
                  <span style={{ display: 'grid', placeItems: 'center', width: 48, height: 48, borderRadius: '50%', backgroundImage: 'var(--glass-fill-1)', boxShadow: 'var(--glass-rim-1)', color: 'var(--fg-4)' }}>
                    <Icon name="search-x" size={22} />
                  </span>
                  <span style={{ font: 'var(--type-body)', fontSize: 'var(--text-sm)', color: 'var(--fg-3)', maxWidth: '34ch', textWrap: 'pretty' }}>
                    Nothing in the log matches that.
                  </span>
                </div>
              ) : days.map((d) => (
                <section key={d.day} style={{ display: 'grid', gap: 'var(--sp-6)' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-5)' }}>
                    <h2 style={{ font: 'var(--type-title)', letterSpacing: 'var(--tracking-title)', color: 'var(--fg-1)', margin: 0, flex: '0 0 auto' }}>
                      {d.day}
                    </h2>
                    <Kicker style={{ flex: '0 0 auto' }}>{d.date}</Kicker>
                    <span style={{ flex: 1, height: 1, background: 'var(--line-faint)' }} />
                    <Kicker style={{ flex: '0 0 auto' }}>
                      {d.turns.reduce((n, t) => n + t.entries.length, 0)} entries
                    </Kicker>
                  </div>
                  <div style={{ display: 'grid', gap: 'var(--sp-5)' }}>
                    {d.turns.map((t) => (
                      <Turn key={t.id} turn={t} entries={t.entries}
                        reverted={!!reverted[t.id] || !!t.reverted} onRevert={revert} />
                    ))}
                  </div>
                </section>
              ))}

              {!nothing && (
                <p style={{ font: 'var(--type-caption)', color: 'var(--fg-4)', textAlign: 'center', maxWidth: '54ch', margin: '0 auto', textWrap: 'pretty' }}>
                  The log keeps everything. Reads are recorded and cannot be undone because nothing
                  changed; sent mail and public links are recorded and cannot be undone because they left.
                </p>
              )}
            </div>
          </div>
        </div>

        {toast && (
          <div style={{ position: 'fixed', left: 0, right: 0, bottom: 'var(--sp-13)', display: 'grid', placeItems: 'center', zIndex: 80, pointerEvents: 'none' }}>
            <span style={{ pointerEvents: 'auto' }}>
              <Toast icon={<Icon name={toast.icon} size={16} />} title={toast.title} detail={toast.detail} onDismiss={() => setToast(null)} />
            </span>
          </div>
        )}

        {!wide && (
          <div style={{ position: 'fixed', left: 0, right: 0, bottom: 'var(--sp-5)', display: 'grid', placeItems: 'center', zIndex: 50, pointerEvents: 'none' }}>
            <span style={{ pointerEvents: 'auto' }}>
              <MiniNav items={navItems} value="log" onChange={go} />
            </span>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<ActionLog />);
});
</script>
</body>
</html>
