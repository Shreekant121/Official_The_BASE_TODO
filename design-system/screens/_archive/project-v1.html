<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASE — Inside a project</title>
<link rel="icon" href="../assets/favicon.svg">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<script src="../_ds_loader.js"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; }
  .clamp1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* Task rows. Level-1 glass so a stack of forty doesn't become a wall
     of frosted panes; hover lifts one step and reveals its actions. */
  .trow {
    background-image: var(--glass-fill-1);
    box-shadow: var(--glass-rim-1);
    transition: var(--t-hover);
  }
  .trow:hover { background-image: var(--glass-fill-2); box-shadow: var(--glass-rim-2), var(--glass-cast-1); transform: translateX(2px); }
  .trow[data-live="true"], .trow[data-sel="true"] { background-image: var(--glass-tint-accent); box-shadow: var(--glass-rim-2), var(--glow-accent-sm); }
  .trow[data-done="true"] { opacity: 0.48; }
  .trow[data-done="true"]:hover { opacity: 0.72; }

  .racts { opacity: 0; transition: opacity var(--dur-fast) var(--ease-glass); }
  .trow:hover .racts, .racts:focus-within { opacity: 1; }
  .grip { opacity: 0; transition: opacity var(--dur-fast) var(--ease-glass); }
  .colhead:hover .grip, .grip:focus-visible { opacity: 1; }
  @media (hover: none), (pointer: coarse) {
    .racts, .grip { opacity: 1; }
  }

  /* Each column scrolls itself, so the board stays one instrument
     instead of three panes of random height. */
  .colbody { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .colbody::-webkit-scrollbar { width: 8px; }
  .colbody::-webkit-scrollbar-track { background: transparent; }
  .colbody::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: var(--r-pill); }
  .board { overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .board::-webkit-scrollbar { height: 8px; }
  .board::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: var(--r-pill); }

  .addrow { border: 1px dashed var(--line-soft); color: var(--fg-3); background: transparent; transition: var(--t-hover); }
  .addrow:hover { border-color: var(--accent-hairline); color: var(--fg-1); background-image: var(--glass-fill-1); }
</style>
</head>
<body class="ag-page ag-page--calm" data-screen-label="Project">
<div id="root">
  <!-- Static first paint: the shell, so glass is on screen before React mounts. -->
  <div style="display:flex;min-height:100vh">
    <div style="width:104px;flex:0 0 auto"></div>
    <div style="flex:1;min-width:0;padding:var(--sp-11) var(--gutter-page) var(--sp-13)">
      <div style="display:flex;align-items:center;gap:var(--sp-4)">
        <img src="../assets/mark-white.png" alt="" width="26" height="26" style="opacity:.95">
        <span style="font:var(--type-title);color:var(--fg-1)">BASE</span>
      </div>
      <div style="height:196px;margin-top:var(--sp-9);border-radius:var(--r-card-lg);background-image:var(--glass-fill-2);backdrop-filter:var(--glass-bd-md);-webkit-backdrop-filter:var(--glass-bd-md);box-shadow:var(--glass-shadow-pane)"></div>
    </div>
  </div>
</div>
<script type="text/ag-jsx">
AG_LOAD([
  '../components/material/GlassFilters.jsx',
  '../components/core/Icon.jsx',
  '../components/actions/Button.jsx',
  '../components/actions/IconButton.jsx',
  '../components/actions/SegmentedControl.jsx',
  '../components/forms/Switch.jsx',
  '../components/data/StatusPill.jsx',
  '../components/data/ProgressRing.jsx',
  '../components/navigation/MiniNav.jsx',
  '../components/overlay/MorphMenu.jsx'
]).then(function (AG) {
  const { GlassFilters, Icon, Button, IconButton, SegmentedControl, Switch, StatusPill, ProgressRing, MiniNav, MorphMenu } = AG;

  const NAV = [
    { value: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
    { value: 'home',      label: 'Home',      icon: 'house' },
    { value: 'assistant', label: 'Assistant', icon: 'sparkles' },
    { value: 'score',     label: 'Score',     icon: 'award', badge: 6 },
    { value: 'alerts',    label: 'Alerts',    icon: 'bell' },
    { value: 'settings',  label: 'Settings',  icon: 'settings' },
  ];

  const PROJECT = {
    name: 'Shreekant Empire',
    desc: 'The holding company — incorporation, compliance and the first year of filings.',
    budget: '₹1.6L',
    lists: 3, tasks: 5, done: 1, progress: 20,
  };

  /* Faithful to the current screen's content, so the two can be compared
     line for line. Priority is the app's own weight; it sets row order. */
  const LISTS = [
    {
      id: 'build', name: 'Build', budget: '₹40,000',
      tasks: [
        {
          id: 'copy', title: 'Rewrite the landing page copy',
          note: 'Lead with the outcome, not the process. Three sections, one call to action.',
          due: '16 Mar', alloc: 150, sub: [0, 3], repeat: 'Monthly · last of 3',
          tags: ['writing', 'web'], pri: 7.5, state: 'queued',
        },
      ],
    },
    {
      id: 'ops', name: 'Operations', budget: '₹25,000',
      tasks: [
        {
          id: 'inc', title: 'File the incorporation paperwork',
          note: 'Form INC-32 plus the MOA and AOA. The CA has the drafts; they need signing and uploading.',
          due: 'Tomorrow', urgent: true, alloc: 90, elapsed: 32, sub: [2, 5],
          tags: ['legal'], pri: 11.0, state: 'running',
        },
        {
          id: 'compliance', title: 'Quarterly compliance review',
          note: 'Registers, minutes and the statutory file, checked against the register.',
          due: 'In 2 days', alloc: 60, repeat: 'Fortnightly · 1 of 8',
          tags: ['compliance'], pri: 7.0, state: 'queued',
        },
      ],
    },
    {
      id: 'money', name: 'Money', budget: '₹95,000',
      tasks: [
        {
          id: 'account', title: 'Open the current account',
          note: 'Needs the certificate of incorporation, so it cannot start until the filing clears.',
          due: '20 Mar', alloc: 120, tags: ['banking'], pri: 7.0,
          state: 'queued', blockedBy: 'File the incorporation paperwork',
        },
        {
          id: 'invoices', title: 'Chase the outstanding invoices',
          note: 'Two are past thirty days. Polite first note, then a call.',
          alloc: 45, repeat: 'Daily · finished', tags: [], pri: 9.0,
          state: 'done', done: true,
        },
      ],
    },
  ];

  const ALL = LISTS.flatMap((l) => l.tasks.map((t) => ({ ...t, list: l.name })));
  const byPri = (a, b) => b.pri - a.pri;

  const mins = (m) => m + ' min';
  const clock = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  const totalAlloc = (tasks) => tasks.filter((t) => !t.done).reduce((n, t) => n + t.alloc, 0);
  const doneCount = (tasks) => tasks.filter((t) => t.done).length;

  /* ------------------------------------------------------------------ */
  /* Small shared pieces                                                */

  function Mono({ children, size = 'var(--text-xs)', color = 'var(--fg-3)', style }) {
    return (
      <span style={{ font: 'var(--type-numeric)', fontSize: size, color, fontVariantNumeric: 'tabular-nums', ...style }}>
        {children}
      </span>
    );
  }

  /* A measured fact: 16px icon + mono value. Never a coloured pill —
     colour in this system means status, and status has its own pill. */
  function Fact({ icon, children, tone = 'var(--fg-3)' }) {
    return (
      <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, color: tone, minWidth: 0 }}>
        <Icon name={icon} size={13} />
        <Mono color={tone}>{children}</Mono>
      </span>
    );
  }

  function Tag({ children }) {
    return (
      <span style={{
        font: 'var(--type-kicker)', color: 'var(--fg-3)', letterSpacing: '0.02em',
        padding: '3px var(--sp-3)', borderRadius: 'var(--r-pill)',
        backgroundImage: 'var(--glass-well)', boxShadow: 'var(--glass-well-shadow)',
        whiteSpace: 'nowrap',
      }}>
        {children}
      </span>
    );
  }

  /* Completion box, lifted from TaskRow so the tick draws the same way.
     Padded out to a 44px hit area without a 44px box. */
  function Tick({ done, disabled, onToggle }) {
    return (
      <button
        type="button"
        onClick={(e) => { e.stopPropagation(); if (!disabled) onToggle(); }}
        disabled={disabled}
        aria-label={done ? 'Mark not done' : 'Mark done'}
        aria-pressed={!!done}
        style={{
          flex: '0 0 auto', width: 42, height: 42, margin: -9, padding: 0, border: 0,
          display: 'grid', placeItems: 'center', background: 'transparent',
          cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.4 : 1,
        }}
      >
        <span style={{
          display: 'grid', placeItems: 'center', width: 24, height: 24,
          borderRadius: 'var(--r-xs)',
          backgroundImage: done ? 'var(--glass-tint-accent)' : 'var(--glass-well)',
          boxShadow: done ? 'var(--glass-rim-2), var(--glow-accent-sm)' : 'var(--glass-well-shadow), 0 0 0 1px var(--line-soft)',
          transition: 'background var(--dur-base) var(--ease-glass), box-shadow var(--dur-base) var(--ease-glass)',
        }}>
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.5 8.5 L6.5 11.5 L12.5 4.5" fill="none" stroke="var(--fg-1)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
              style={{ strokeDasharray: 16, strokeDashoffset: done ? 0 : 16, transition: 'stroke-dashoffset var(--dur-base) var(--ease-glass)' }} />
          </svg>
        </span>
      </button>
    );
  }

  /* Blocked is stated, not shouted: the blocker is named on a neutral
     well. A red box on a task you cannot start is noise you can't act on. */
  function BlockedLine({ on }) {
    return (
      <span style={{
        display: 'inline-flex', alignItems: 'center', gap: 6, minWidth: 0,
        padding: '4px var(--sp-4) 4px var(--sp-3)', borderRadius: 'var(--r-pill)',
        backgroundImage: 'var(--glass-well)', boxShadow: 'var(--glass-well-shadow)',
        color: 'var(--fg-3)',
      }}>
        <Icon name="lock" size={13} />
        <span className="clamp1" style={{ font: 'var(--type-caption)', color: 'var(--fg-3)' }}>
          Waiting on <span style={{ color: 'var(--fg-2)' }}>{on}</span>
        </span>
      </span>
    );
  }

  function rowMenu(t) {
    return [
      { label: 'Start now', icon: <Icon name="zap" size={18} /> },
      { label: 'Edit task', icon: <Icon name="square-pen" size={18} />, meta: <Icon name="chevron-right" size={16} /> },
      { label: 'Move to list', icon: <Icon name="corner-up-right" size={18} />, meta: <Icon name="chevron-right" size={16} /> },
      { divider: true },
      {
        label: 'Delete task', icon: <Icon name="trash-2" size={18} />, tone: 'danger',
        confirm: { label: 'Delete this task?', hint: t.title, action: 'Delete' },
      },
    ];
  }

  /* ------------------------------------------------------------------ */
  /* Board card                                                         */

  function TaskCard({ t, selectMode, selected, onSelect, onToggle }) {
    const live = t.state === 'running';
    const pick = () => { if (selectMode && !t.done) onSelect(t.id); };

    return (
      <article
        className="trow"
        data-live={live ? 'true' : 'false'}
        data-sel={selected ? 'true' : 'false'}
        data-done={t.done ? 'true' : 'false'}
        onClick={pick}
        style={{
          display: 'grid', gridTemplateColumns: '24px 1fr', columnGap: 'var(--sp-5)', rowGap: 'var(--sp-4)',
          padding: 'var(--sp-5) var(--sp-6)', borderRadius: 'var(--r-md)',
          cursor: selectMode && !t.done ? 'pointer' : 'default',
        }}
      >
        <Tick done={t.done} disabled={!!t.blockedBy} onToggle={() => onToggle(t.id)} />

        <div style={{ minWidth: 0, display: 'grid', gap: 'var(--sp-3)' }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 'var(--sp-4)' }}>
            <h3 style={{
              flex: 1, minWidth: 0, font: 'var(--type-body)', color: t.done ? 'var(--fg-3)' : 'var(--fg-1)',
              letterSpacing: 'var(--tracking-ui)',
              textDecoration: t.done ? 'line-through' : 'none', textDecorationColor: 'var(--fg-4)',
            }}>
              {t.title}
            </h3>
            <span className="racts" style={{ display: 'flex', gap: 'var(--sp-2)', flex: '0 0 auto', marginTop: -4 }}>
              <MorphMenu
                align="end"
                width={244}
                trigger={<IconButton label={'Actions for ' + t.title} size="sm" variant="ghost"><Icon name="ellipsis" size={16} /></IconButton>}
                items={rowMenu(t)}
              />
            </span>
          </div>

          {t.note && (
            <p className="clamp1" style={{ font: 'var(--type-caption)', color: 'var(--fg-3)', lineHeight: 'var(--leading-normal)' }}>
              {t.note}
            </p>
          )}

          {live && (
            <div style={{ display: 'grid', gap: 6 }}>
              <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
                <StatusPill status="running" size="sm">Running</StatusPill>
                <Mono color="var(--accent)">{t.elapsed} / {t.alloc} min</Mono>
              </div>
              <div style={{ height: 4, borderRadius: 'var(--r-pill)', backgroundImage: 'var(--glass-well)', boxShadow: 'var(--glass-well-shadow)', overflow: 'hidden' }}>
                <div style={{ height: '100%', width: (t.elapsed / t.alloc * 100) + '%', borderRadius: 'var(--r-pill)', background: 'var(--accent)', boxShadow: '0 0 12px -1px var(--accent)' }} />
              </div>
            </div>
          )}

          {t.blockedBy && <BlockedLine on={t.blockedBy} />}

          {/* Measured facts, always in this order: when · how long · how far · how often */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-5)', flexWrap: 'wrap' }}>
            {t.due && !t.done && (
              t.urgent
                ? <StatusPill status="review" size="sm">{t.due}</StatusPill>
                : <Fact icon="calendar">{t.due}</Fact>
            )}
            {!live && <Fact icon="clock" tone={t.done ? 'var(--fg-4)' : 'var(--fg-3)'}>{mins(t.alloc)}</Fact>}
            {t.sub && <Fact icon="corner-down-right">{t.sub[0]}/{t.sub[1]}</Fact>}
            {t.repeat && <Fact icon="repeat">{t.repeat}</Fact>}
          </div>

          {t.tags.length > 0 && (
            <div style={{ display: 'flex', gap: 'var(--sp-3)', flexWrap: 'wrap' }}>
              {t.tags.map((g) => <Tag key={g}>#{g}</Tag>)}
            </div>
          )}
        </div>
      </article>
    );
  }

  /* ------------------------------------------------------------------ */
  /* Board column                                                       */

  function Column({ list, selectMode, selected, onSelect, onToggle, showDone }) {
    const tasks = list.tasks.filter((t) => showDone || !t.done).slice().sort(byPri);
    const done = doneCount(list.tasks);
    const pct = list.tasks.length ? Math.round(done / list.tasks.length * 100) : 0;

    return (
      <section
        style={{
          display: 'grid', gridTemplateRows: 'auto minmax(0, 1fr) auto', minWidth: 0,
          maxHeight: 'clamp(420px, 66vh, 760px)',
          borderRadius: 'var(--r-card)',
          backgroundImage: 'var(--glass-fill-2)',
          backdropFilter: 'var(--glass-bd-md-refract)',
          WebkitBackdropFilter: 'var(--glass-bd-md)',
          boxShadow: 'var(--glass-shadow-pane)',
        }}
      >
        <header className="colhead" style={{ display: 'grid', gap: 'var(--sp-4)', padding: 'var(--sp-6) var(--sp-6) var(--sp-5)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)', minWidth: 0 }}>
            <span className="grip" style={{ display: 'flex', color: 'var(--fg-4)', marginLeft: -6, cursor: 'grab' }} title="Drag to reorder">
              <Icon name="grip-vertical" size={16} />
            </span>
            <h2 style={{ font: 'var(--type-title)', fontSize: 'var(--text-md)', color: 'var(--fg-1)', letterSpacing: 'var(--tracking-ui)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
              {list.name}
            </h2>
            <Mono color="var(--fg-4)">{done}/{list.tasks.length}</Mono>
            <span style={{ flex: 1 }} />
            <span style={{
              font: 'var(--type-numeric)', fontSize: 'var(--text-2xs)', color: 'var(--fg-2)',
              fontVariantNumeric: 'tabular-nums', padding: '3px var(--sp-4)', borderRadius: 'var(--r-pill)',
              backgroundImage: 'var(--glass-fill-1)', boxShadow: 'var(--glass-rim-1)', whiteSpace: 'nowrap',
            }}>
              {list.budget}
            </span>
            <MorphMenu
              align="end"
              width={236}
              trigger={<IconButton label={'Actions for ' + list.name} size="sm" variant="ghost"><Icon name="ellipsis" size={16} /></IconButton>}
              header={{ title: list.name, meta: [list.tasks.length + ' tasks', mins(totalAlloc(list.tasks)) + ' left', list.budget].join('  ·  ') }}
              items={[
                { label: 'Rename list', icon: <Icon name="square-pen" size={18} /> },
                { label: 'Add task', icon: <Icon name="plus" size={18} /> },
                { divider: true },
                { label: 'Delete list', icon: <Icon name="trash-2" size={18} />, tone: 'danger', confirm: { label: 'Delete ' + list.name + '?', hint: list.tasks.length + ' tasks go with it.', action: 'Delete' } },
              ]}
            />
          </div>

          {/* Two numbers per list, and only two: work left, and how far in. */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)' }}>
            <div style={{ flex: 1, height: 3, borderRadius: 'var(--r-pill)', backgroundImage: 'var(--glass-well)', boxShadow: 'var(--glass-well-shadow)', overflow: 'hidden' }}>
              <div style={{ height: '100%', width: pct + '%', borderRadius: 'var(--r-pill)', background: pct ? 'var(--accent)' : 'transparent', boxShadow: pct ? '0 0 10px -2px var(--accent)' : 'none', transition: 'width var(--dur-slow) var(--ease-glass)' }} />
            </div>
            <Mono color="var(--fg-4)">{mins(totalAlloc(list.tasks))} left</Mono>
          </div>
        </header>

        <div className="colbody" style={{ display: 'grid', gap: 'var(--sp-3)', alignContent: 'start', padding: '0 var(--sp-5)' }}>
          {tasks.length === 0 && (
            <p style={{ font: 'var(--type-caption)', color: 'var(--fg-4)', padding: 'var(--sp-6) var(--sp-2)' }}>Nothing here.</p>
          )}
          {tasks.map((t) => (
            <TaskCard
              key={t.id}
              t={t}
              selectMode={selectMode}
              selected={selected.has(t.id)}
              onSelect={onSelect}
              onToggle={onToggle}
            />
          ))}
        </div>

        <div style={{ padding: 'var(--sp-5)' }}>
          <button type="button" className="addrow" style={{
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 'var(--sp-3)',
            width: '100%', minHeight: 44, borderRadius: 'var(--r-pill)', cursor: 'pointer',
            font: 'var(--type-label)',
          }}>
            <Icon name="plus" size={16} />
            Add task
          </button>
        </div>
      </section>
    );
  }

  /* A 76px strip, not a card-sized dashed void: adding a list is a
     rare action and should not read as an empty fourth list. */
  function AddList() {
    const [hover, setHover] = React.useState(false);
    return (
      <button
        type="button"
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => setHover(false)}
        style={{
          display: 'grid', placeItems: 'center', gap: 'var(--sp-4)', alignContent: 'center',
          width: 76, alignSelf: 'stretch', minHeight: 320, padding: 'var(--sp-5)',
          borderRadius: 'var(--r-card)', cursor: 'pointer',
          border: '1px dashed ' + (hover ? 'var(--accent-hairline)' : 'var(--line-soft)'),
          background: hover ? 'var(--glass-fill-1)' : 'transparent',
          color: hover ? 'var(--fg-1)' : 'var(--fg-3)',
          transition: 'var(--t-hover)',
        }}
      >
        <span style={{ display: 'grid', placeItems: 'center', width: 40, height: 40, borderRadius: '50%', backgroundImage: 'var(--glass-fill-2)', boxShadow: 'var(--glass-rim-2)' }}>
          <Icon name="plus" size={18} />
        </span>
        <span style={{ font: 'var(--type-kicker)', textTransform: 'uppercase', letterSpacing: 'var(--tracking-kicker)', writingMode: 'vertical-rl', transform: 'rotate(180deg)' }}>
          Add list
        </span>
      </button>
    );
  }

  /* ------------------------------------------------------------------ */
  /* List view — the same tasks as a table, where numbers get headings   */

  const GRID = '24px minmax(220px, 1fr) auto 104px 84px 62px 44px';

  function ListRow({ t, selectMode, selected, onSelect, onToggle }) {
    const live = t.state === 'running';
    return (
      <div
        className="trow"
        data-live={live ? 'true' : 'false'}
        data-sel={selected ? 'true' : 'false'}
        data-done={t.done ? 'true' : 'false'}
        onClick={() => { if (selectMode && !t.done) onSelect(t.id); }}
        style={{
          display: 'grid', gridTemplateColumns: GRID, alignItems: 'center', gap: 'var(--sp-5)',
          minHeight: 60, padding: 'var(--sp-4) var(--sp-6)', borderRadius: 'var(--r-md)',
          cursor: selectMode && !t.done ? 'pointer' : 'default',
        }}
      >
        <Tick done={t.done} disabled={!!t.blockedBy} onToggle={() => onToggle(t.id)} />

        <div style={{ minWidth: 0, display: 'grid', gap: 3 }}>
          <span style={{
            font: 'var(--type-body)', color: t.done ? 'var(--fg-3)' : 'var(--fg-1)',
            whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
            textDecoration: t.done ? 'line-through' : 'none', textDecorationColor: 'var(--fg-4)',
          }}>
            {t.title}
          </span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)', minWidth: 0 }}>
            {live && <StatusPill status="running" size="sm">Running · {t.elapsed}/{t.alloc} min</StatusPill>}
            {t.blockedBy && <BlockedLine on={t.blockedBy} />}
            {!live && !t.blockedBy && t.repeat && <Fact icon="repeat">{t.repeat}</Fact>}
            {!live && !t.blockedBy && !t.repeat && t.sub && <Fact icon="corner-down-right">{t.sub[0]}/{t.sub[1]} subtasks</Fact>}
          </span>
        </div>

        <span style={{ display: 'flex', gap: 'var(--sp-3)', flexWrap: 'nowrap' }}>
          {t.tags.map((g) => <Tag key={g}>#{g}</Tag>)}
        </span>

        <span style={{ textAlign: 'right' }}>
          {t.due
            ? (t.urgent ? <StatusPill status="review" size="sm">{t.due}</StatusPill> : <Mono>{t.due}</Mono>)
            : <Mono color="var(--fg-4)">—</Mono>}
        </span>
        <span style={{ textAlign: 'right' }}><Mono color={t.done ? 'var(--fg-4)' : 'var(--fg-2)'}>{mins(t.alloc)}</Mono></span>
        <span style={{ textAlign: 'right' }}><Mono color="var(--fg-3)">{t.pri.toFixed(1)}</Mono></span>

        <span className="racts" style={{ justifySelf: 'end' }}>
          <MorphMenu
            align="end"
            width={244}
            trigger={<IconButton label={'Actions for ' + t.title} size="sm" variant="ghost"><Icon name="ellipsis" size={16} /></IconButton>}
            items={rowMenu(t)}
          />
        </span>
      </div>
    );
  }

  function ListView({ selectMode, selected, onSelect, onToggle, showDone }) {
    return (
      <div style={{
        display: 'grid', gap: 'var(--sp-7)', padding: 'var(--pad-card)',
        borderRadius: 'var(--r-card)',
        backgroundImage: 'var(--glass-fill-2)',
        backdropFilter: 'var(--glass-bd-md-refract)',
        WebkitBackdropFilter: 'var(--glass-bd-md)',
        boxShadow: 'var(--glass-shadow-pane)',
      }}>
        {/* Headings are what make a number readable. */}
        <div style={{ display: 'grid', gridTemplateColumns: GRID, gap: 'var(--sp-5)', padding: '0 var(--sp-6)' }}>
          <span />
          <span className="ag-kicker">Task</span>
          <span />
          <span className="ag-kicker" style={{ textAlign: 'right' }}>Due</span>
          <span className="ag-kicker" style={{ textAlign: 'right' }}>Allocated</span>
          <span className="ag-kicker" style={{ textAlign: 'right' }}>Priority</span>
          <span />
        </div>

        {LISTS.map((l) => {
          const tasks = l.tasks.filter((t) => showDone || !t.done).slice().sort(byPri);
          if (!tasks.length) return null;
          return (
            <section key={l.id} style={{ display: 'grid', gap: 'var(--sp-3)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)', padding: '0 var(--sp-6) var(--sp-2)' }}>
                <span style={{ font: 'var(--type-label)', color: 'var(--fg-2)' }}>{l.name}</span>
                <Mono color="var(--fg-4)">{doneCount(l.tasks)}/{l.tasks.length}</Mono>
                <span style={{ flex: 1, height: 1, background: 'var(--line-faint)' }} />
                <Mono color="var(--fg-4)">{mins(totalAlloc(l.tasks))} left</Mono>
                <Mono color="var(--fg-3)">{l.budget}</Mono>
              </div>
              {tasks.map((t) => (
                <ListRow key={t.id} t={t} selectMode={selectMode} selected={selected.has(t.id)} onSelect={onSelect} onToggle={onToggle} />
              ))}
            </section>
          );
        })}
      </div>
    );
  }

  /* ------------------------------------------------------------------ */
  /* Masthead — the project, and the one question the product answers    */

  function Masthead({ session, secs, onEnd, onStart, wide }) {
    const running = ALL.find((t) => t.state === 'running');
    const next = ALL.filter((t) => !t.done && !t.blockedBy).sort(byPri)[0];

    return (
      <section style={{
        display: 'grid',
        gridTemplateColumns: wide ? 'minmax(0, 1fr) 344px' : '1fr',
        gap: 'var(--sp-9)',
        padding: 'var(--pad-card-lg)',
        borderRadius: 'var(--r-card-lg)',
        backgroundImage: 'var(--glass-fill-2)',
        backdropFilter: 'var(--glass-bd-lg-refract)',
        WebkitBackdropFilter: 'var(--glass-bd-lg)',
        boxShadow: 'var(--glass-rim-2), var(--glass-inner-1), var(--glass-cast-2)',
      }}>
        <div style={{ display: 'grid', gap: 'var(--sp-6)', alignContent: 'start', minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)' }}>
            <span className="ag-kicker">Project</span>
            <span style={{ width: 4, height: 4, borderRadius: '50%', background: 'var(--fg-4)' }} />
            <Mono color="var(--fg-4)">{PROJECT.lists} lists</Mono>
          </div>

          <div style={{ display: 'grid', gap: 'var(--sp-4)', minWidth: 0 }}>
            <h1 style={{ font: 'var(--type-metric)', letterSpacing: 'var(--tracking-display)', color: 'var(--fg-1)' }}>
              {PROJECT.name}
            </h1>
            <p style={{ font: 'var(--type-body)', color: 'var(--fg-3)', maxWidth: '46ch', textWrap: 'pretty' }}>
              {PROJECT.desc}
            </p>
          </div>

          <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-7)', flexWrap: 'wrap', paddingTop: 'var(--sp-5)', borderTop: '1px solid var(--line-faint)' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-5)' }}>
              <ProgressRing value={PROJECT.progress} size={54} thickness={5} showValue />
              <span style={{ display: 'grid', gap: 2 }}>
                <Mono size="var(--text-sm)" color="var(--fg-1)">{PROJECT.done} of {PROJECT.tasks}</Mono>
                <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)' }}>tasks done</span>
              </span>
            </span>
            <span style={{ width: 1, height: 34, background: 'var(--line-faint)' }} />
            <span style={{ display: 'grid', gap: 2 }}>
              <Mono size="var(--text-sm)" color="var(--fg-1)">{mins(totalAlloc(ALL))}</Mono>
              <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)' }}>work left</span>
            </span>
            <span style={{ width: 1, height: 34, background: 'var(--line-faint)' }} />
            <span style={{ display: 'grid', gap: 2 }}>
              <Mono size="var(--text-sm)" color="var(--fg-1)">{PROJECT.budget}</Mono>
              <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)' }}>budget</span>
            </span>
          </div>
        </div>

        {/* The one live object on the screen. Emerald appears here and
            on its row, and nowhere else. */}
        <aside style={{
          display: 'grid', gap: 'var(--sp-6)', alignContent: 'space-between',
          padding: 'var(--pad-card)', borderRadius: 'var(--r-card)',
          backgroundImage: session ? 'var(--glass-tint-accent)' : 'var(--glass-fill-1)',
          boxShadow: session
            ? 'var(--glass-rim-2), var(--glass-inner-1), var(--glow-accent-sm)'
            : 'var(--glass-rim-1), var(--glass-inner-1)',
          transition: 'background var(--dur-slow) var(--ease-glass), box-shadow var(--dur-slow) var(--ease-glass)',
        }}>
          {session ? (
            <React.Fragment>
              <div style={{ display: 'grid', gap: 'var(--sp-4)' }}>
                <span className="ag-kicker" style={{ color: 'var(--accent)' }}>Running now</span>
                <span className="clamp2" style={{ font: 'var(--type-label)', fontSize: 'var(--text-md)', color: 'var(--fg-1)' }}>
                  {running.title}
                </span>
              </div>
              <div style={{ display: 'grid', gap: 'var(--sp-2)' }}>
                <span style={{ font: 'var(--type-timer)', fontSize: 'var(--text-3xl)', color: 'var(--fg-1)', fontVariantNumeric: 'tabular-nums' }}>
                  {clock(secs)}
                </span>
                <span style={{ font: 'var(--type-caption)', color: 'var(--fg-3)' }}>
                  left of {mins(running.alloc)} · {running.list}
                </span>
              </div>
              <div style={{ display: 'flex', gap: 'var(--sp-4)', flexWrap: 'wrap' }}>
                <Button variant="solid" iconLeft={<Icon name="maximize-2" size={16} />}>Focus</Button>
                <Button variant="ghost" onClick={onEnd}>End</Button>
              </div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <div style={{ display: 'grid', gap: 'var(--sp-4)' }}>
                <span className="ag-kicker">Next up</span>
                <span className="clamp2" style={{ font: 'var(--type-label)', fontSize: 'var(--text-md)', color: 'var(--fg-1)' }}>
                  {next.title}
                </span>
                <span style={{ font: 'var(--type-caption)', color: 'var(--fg-3)' }}>
                  {mins(next.alloc)} allocated · {next.list}
                </span>
              </div>
              <p style={{ font: 'var(--type-caption)', color: 'var(--fg-4)' }}>Strict focus. One task at a time.</p>
              <Button variant="solid" iconLeft={<Icon name="zap" size={16} />} onClick={onStart}>Start session</Button>
            </React.Fragment>
          )}
        </aside>
      </section>
    );
  }

  /* ------------------------------------------------------------------ */

  function Screen() {
    const [view, setView] = React.useState('board');
    const [nav, setNav] = React.useState('home');
    const [wide, setWide] = React.useState(window.innerWidth >= 1080);
    const [showDone, setShowDone] = React.useState(true);
    const [selectMode, setSelectMode] = React.useState(false);
    const [selected, setSelected] = React.useState(new Set());
    const [done, setDone] = React.useState(new Set(['invoices']));
    const [session, setSession] = React.useState(true);
    const [secs, setSecs] = React.useState(58 * 60 + 12);

    React.useEffect(() => {
      const on = () => setWide(window.innerWidth >= 1080);
      window.addEventListener('resize', on);
      return () => window.removeEventListener('resize', on);
    }, []);

    React.useEffect(() => {
      if (!session) return;
      const id = setInterval(() => setSecs((s) => (s > 0 ? s - 1 : 0)), 1000);
      return () => clearInterval(id);
    }, [session]);

    const lists = LISTS.map((l) => ({ ...l, tasks: l.tasks.map((t) => ({ ...t, done: done.has(t.id), state: done.has(t.id) ? 'done' : t.state })) }));

    const onToggle = (id) => setDone((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });

    const onSelect = (id) => setSelected((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });

    const picked = ALL.filter((t) => selected.has(t.id));
    const navItems = NAV.map((n) => ({ value: n.value, label: n.label, icon: <Icon name={n.icon} size={20} />, badge: n.badge }));

    return (
      <div style={{ display: 'flex', minHeight: '100vh', alignItems: 'flex-start' }}>
        <GlassFilters />

        {wide && (
          <div style={{ position: 'sticky', top: 'var(--sp-9)', flex: '0 0 auto', padding: 'var(--sp-9) 0 var(--sp-9) var(--sp-7)' }}>
            <MiniNav orientation="vertical" items={navItems} value={nav} onChange={setNav} />
          </div>
        )}

        <div style={{ flex: 1, minWidth: 0, padding: wide ? 'var(--sp-11) var(--gutter-page) var(--sp-13)' : 'var(--sp-9) var(--gutter-page-sm) 148px' }}>
          <header style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-5)', flexWrap: 'wrap', marginBottom: 'var(--sp-9)' }}>
            <a href="home.html" style={{ display: 'flex', textDecoration: 'none' }} aria-label="Back to projects">
              <IconButton label="Back to projects" variant="ghost"><Icon name="arrow-left" size={18} /></IconButton>
            </a>
            <img src="../assets/mark-white.png" alt="" width="26" height="26" style={{ opacity: 0.95, display: 'block' }} />
            <span style={{ font: 'var(--type-label)', color: 'var(--fg-3)' }}>Projects</span>
            <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)' }}>/</span>
            <span style={{ font: 'var(--type-label)', color: 'var(--fg-1)' }}>{PROJECT.name}</span>
            <span style={{ flex: 1 }} />
            <IconButton label="Search tasks and commands" variant="ghost"><Icon name="search" size={18} /></IconButton>
            <MorphMenu
              align="end"
              width={252}
              trigger={<IconButton label="Project actions" variant="ghost"><Icon name="ellipsis" size={18} /></IconButton>}
              header={{ title: PROJECT.name, meta: [PROJECT.lists + ' lists', PROJECT.tasks + ' tasks', PROJECT.budget].join('  ·  ') }}
              items={[
                { label: 'Edit project', icon: <Icon name="square-pen" size={18} />, meta: <Icon name="chevron-right" size={16} /> },
                { label: 'Share project', icon: <Icon name="share-2" size={18} />, meta: <Icon name="chevron-right" size={16} /> },
                { divider: true },
                { label: 'Delete project', icon: <Icon name="trash-2" size={18} />, tone: 'danger', confirm: { label: 'Delete ' + PROJECT.name + '?', hint: PROJECT.lists + ' lists and ' + PROJECT.tasks + ' tasks go with it.', action: 'Delete' } },
              ]}
            />
          </header>

          <div style={{ display: 'grid', gap: 'var(--gap-section)' }}>
            <Masthead
              session={session}
              secs={secs}
              wide={wide}
              onEnd={() => setSession(false)}
              onStart={() => { setSession(true); setSecs(58 * 60 + 12); }}
            />

            <section style={{ display: 'grid', gap: 'var(--sp-7)' }}>
              {/* Toolbar: how the tasks are shaped, not what they are. */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-5)', flexWrap: 'wrap' }}>
                <SegmentedControl
                  value={view}
                  onChange={setView}
                  options={[
                    { value: 'board', label: 'Board', icon: <Icon name="columns-3" size={16} /> },
                    { value: 'list', label: 'List', icon: <Icon name="list" size={16} /> },
                  ]}
                />
                <MorphMenu
                  align="start"
                  width={228}
                  trigger={
                    <Button variant="ghost" iconLeft={<Icon name="arrow-down-up" size={16} />} iconRight={<Icon name="chevron-down" size={15} />}>
                      Priority
                    </Button>
                  }
                  items={[
                    { label: 'Priority', icon: <Icon name="check" size={16} /> },
                    { label: 'Deadline', icon: <Icon name="calendar" size={16} /> },
                    { label: 'Allocated time', icon: <Icon name="clock" size={16} /> },
                    { label: 'Manual', icon: <Icon name="grip-vertical" size={16} /> },
                  ]}
                />
                <Switch checked={showDone} onChange={setShowDone} size="sm" label="Show done" />
                <span style={{ flex: 1 }} />
                <Button
                  variant={selectMode ? 'tint' : 'glass'}
                  iconLeft={<Icon name={selectMode ? 'check-check' : 'list-checks'} size={16} />}
                  onClick={() => { setSelectMode(!selectMode); setSelected(new Set()); }}
                >
                  {selectMode ? 'Selecting' : 'Select'}
                </Button>
                <Button iconLeft={<Icon name="plus" size={16} />}>New task</Button>
              </div>

              {view === 'board' ? (
                <div className="board" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(316px, 1fr)) 76px', gap: 'var(--gap-card)', alignItems: 'stretch', paddingBottom: 'var(--sp-4)' }}>
                  {lists.map((l) => (
                    <Column
                      key={l.id}
                      list={l}
                      selectMode={selectMode}
                      selected={selected}
                      onSelect={onSelect}
                      onToggle={onToggle}
                      showDone={showDone}
                    />
                  ))}
                  <AddList />
                </div>
              ) : (
                <ListView selectMode={selectMode} selected={selected} onSelect={onSelect} onToggle={onToggle} showDone={showDone} />
              )}
            </section>

            <Notes />
          </div>
        </div>

        {!wide && (
          <div style={{ position: 'fixed', left: 0, right: 0, bottom: 'var(--sp-6)', display: 'grid', placeItems: 'center', zIndex: 50, pointerEvents: 'none' }}>
            <span style={{ pointerEvents: 'auto' }}>
              <MiniNav items={navItems} value={nav} onChange={setNav} />
            </span>
          </div>
        )}

        {/* Selection bar — the bridge from this view to Focus. Morphs up
            out of the toolbar's Select button, and carries the total. */}
        <div style={{ position: 'fixed', left: 0, right: 0, bottom: wide ? 'var(--sp-9)' : 108, display: 'grid', placeItems: 'center', zIndex: 60, pointerEvents: 'none' }}>
          <div style={{
            pointerEvents: picked.length ? 'auto' : 'none',
            display: 'flex', alignItems: 'center', gap: 'var(--sp-6)',
            minHeight: 60, padding: 'var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-8)',
            borderRadius: 'var(--r-pill)',
            backgroundImage: 'var(--glass-fill-3)',
            backdropFilter: 'var(--glass-bd-lg)',
            WebkitBackdropFilter: 'var(--glass-bd-lg)',
            boxShadow: 'var(--glass-shadow-pane)',
            opacity: picked.length ? 1 : 0,
            transform: picked.length ? 'translateY(0) scale(1)' : 'translateY(14px) scale(0.96)',
            transition: 'opacity var(--dur-base) var(--ease-glass), transform var(--dur-base) var(--ease-spring)',
          }}>
            <span style={{ display: 'grid', gap: 1 }}>
              <Mono size="var(--text-sm)" color="var(--fg-1)">{picked.length} selected</Mono>
              <span style={{ font: 'var(--type-caption)', color: 'var(--fg-3)' }}>
                {mins(picked.reduce((n, t) => n + t.alloc, 0))} of work
              </span>
            </span>
            <Button variant="ghost" size="sm" onClick={() => setSelected(new Set())}>Clear</Button>
            <Button variant="solid" iconLeft={<Icon name="zap" size={16} />}>Start session</Button>
          </div>
        </div>
      </div>
    );
  }

  /* ------------------------------------------------------------------ */

  const NOTES = [
    ['Numbers only where they have a name', 'The 7.5 / 11.0 pills said nothing. Priority now sets row order in Board and gets a labelled column in List.'],
    ['One accent, one meaning', 'Emerald is only the running session and its row. Budgets are mono chips; deadlines use one amber pill, not four hues.'],
    ['Four levels, always the same order', 'Title, one-line intent, measured facts in mono, tags. Every row reads the same way, so a stack of forty stays scannable.'],
    ['Blocked is stated, not shouted', 'A neutral well names the blocker and the tick disables. A red box on a task you cannot start is noise.'],
    ['Equal columns that scroll themselves', 'Lists no longer stretch to random heights, and Add list is a 76px strip instead of an empty fourth list.'],
    ['The header answers the question', 'What is running, how long is left, how much work remains, what it costs — then one button into Focus.'],
  ];

  function Notes() {
    return (
      <section style={{ display: 'grid', gap: 'var(--sp-7)' }}>
        <span className="ag-kicker">What changed</span>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(228px, 1fr))', gap: 'var(--gap-card)' }}>
          {NOTES.map(([title, body]) => (
            <div key={title} style={{ display: 'grid', gap: 'var(--sp-3)', alignContent: 'start', padding: 'var(--sp-6)', borderRadius: 'var(--r-card)', backgroundImage: 'var(--glass-fill-1)', boxShadow: 'var(--glass-rim-1)' }}>
              <span style={{ font: 'var(--type-label)', color: 'var(--fg-1)' }}>{title}</span>
              <span style={{ font: 'var(--type-caption)', color: 'var(--fg-3)', lineHeight: 'var(--leading-normal)' }}>{body}</span>
            </div>
          ))}
        </div>
        <p style={{ font: 'var(--type-caption)', color: 'var(--fg-4)', maxWidth: '70ch' }}>
          Next: the task detail sheet (opened from a row), and drag-and-drop between lists.
        </p>
      </section>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Screen />);
});
</script>
</body>
</html>
