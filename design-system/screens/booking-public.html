<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intro call — Shreekant Studio</title>
<link rel="icon" href="../assets/favicon.svg">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<script src="../_ds_loader.js"></script>
<style>
  html, body { min-height: 100%; }
  body { margin: 0; }
  a { color: var(--fg-1); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
  a:hover { color: var(--accent-lift); border-bottom-color: var(--accent-lift); }
  .ag-scroll { scrollbar-width: none; -ms-overflow-style: none; }
  .ag-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .b-field::placeholder { color: var(--fg-4); opacity: 1; }
  .b-field:focus { outline: none; }
</style>
</head>
<body class="ag-page ag-page--focal" data-screen-label="Booking — public page">
<div id="root">
  <div style="max-width:460px;margin:0 auto;padding:40px 20px">
    <div style="height:200px;border-radius:var(--r-card-lg);background-image:var(--glass-fill-2);box-shadow:var(--glass-shadow-pane)"></div>
  </div>
</div>
<script type="text/ag-jsx">
AG_LOAD([
  '../components/material/GlassFilters.jsx',
  '../components/core/Icon.jsx',
  '../components/actions/Button.jsx',
  '../components/actions/IconButton.jsx',
  '../components/overlay/MorphMenu.jsx'
]).then(function (AG) {
  const { GlassFilters, Icon, Button, IconButton, MorphMenu } = AG;

  /* The business, not the tool. Change these and the page is theirs. */
  const HOST = { business: 'Shreekant Studio', person: 'Shreekant', initials: 'SS', email: 'hello@shreekant.studio' };
  const EVENT = { name: 'Intro call', dur: 30, where: 'Google Meet', about: 'A first conversation about your project. Bring the problem, not a brief.' };

  const ZONES = [
    { value: 'london', label: 'London',   abbr: 'BST', off: -270, detected: true },
    { value: 'dubai',  label: 'Dubai',    abbr: 'GST', off: -90 },
    { value: 'mumbai', label: 'Mumbai',   abbr: 'IST', off: 0 },
    { value: 'ny',     label: 'New York', abbr: 'EDT', off: -570 },
  ];

  /* Slots arrive already steered — IST start minutes, per day. The
     client never sees a tier, only the times they were given. */
  const DAYS = [
    { key: '24', dow: 'Thu', n: 24, mon: 'Sep', slots: [960, 990, 1020] },
    { key: '25', dow: 'Fri', n: 25, mon: 'Sep', slots: [900, 960, 990, 1020] },
    { key: '26', dow: 'Sat', n: 26, mon: 'Sep', slots: [] },
    { key: '27', dow: 'Sun', n: 27, mon: 'Sep', slots: [] },
    { key: '28', dow: 'Mon', n: 28, mon: 'Sep', slots: [900, 930, 1020] },
    { key: '29', dow: 'Tue', n: 29, mon: 'Sep', slots: [900, 930, 960, 990, 1020] },
    { key: '30', dow: 'Wed', n: 30, mon: 'Sep', slots: [900, 930, 960, 990, 1020] },
    { key: '01', dow: 'Thu', n: 1,  mon: 'Oct', slots: [900, 930, 960, 1020] },
    { key: '02', dow: 'Fri', n: 2,  mon: 'Oct', slots: [] },
    { key: '03', dow: 'Sat', n: 3,  mon: 'Oct', slots: [] },
    { key: '04', dow: 'Sun', n: 4,  mon: 'Oct', slots: [] },
    { key: '05', dow: 'Mon', n: 5,  mon: 'Oct', slots: [900, 930, 960, 990, 1020] },
    { key: '06', dow: 'Tue', n: 6,  mon: 'Oct', slots: [900, 960, 990, 1020] },
    { key: '07', dow: 'Wed', n: 7,  mon: 'Oct', slots: [930, 960, 1020] },
  ];
  const LONG = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday' };

  const STATES = [
    { group: 'Booking', items: [['pick', 'Pick a time'], ['details', 'Your details'], ['confirmed', 'Confirmed']] },
    { group: 'Later, from the email', items: [['manage', 'Manage booking'], ['reschedule', 'Reschedule'], ['cancelled', 'Cancelled']] },
    { group: 'Goes wrong', items: [['taken', 'Slot taken'], ['noslots', 'No times open'], ['off', 'Link turned off']] },
  ];

  const hm = (m) => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

  const Kicker = ({ children, color = 'var(--fg-4)', style }) => (
    <span style={{ font: 'var(--type-kicker)', letterSpacing: 'var(--tracking-kicker)', textTransform: 'uppercase', color, ...style }}>{children}</span>
  );
  const Mono = ({ children, color = 'var(--fg-1)', size = 'var(--text-sm)', style }) => (
    <span style={{ font: 'var(--type-numeric)', fontSize: size, color, fontVariantNumeric: 'tabular-nums', ...style }}>{children}</span>
  );
  const P = ({ children, color = 'var(--fg-3)', size = 'var(--text-sm)', style }) => (
    <p style={{ font: 'var(--type-body)', fontSize: size, color, margin: 0, textWrap: 'pretty', ...style }}>{children}</p>
  );
  const Pane = ({ children, style, tint }) => (
    <div style={{
      display: 'grid', gap: 'var(--sp-6)', padding: 'var(--sp-7)', borderRadius: 'var(--r-card-lg)',
      backgroundImage: tint || 'var(--glass-fill-2)', backdropFilter: 'var(--glass-bd-md)', WebkitBackdropFilter: 'var(--glass-bd-md)',
      boxShadow: 'var(--glass-rim-2), var(--glass-inner-1), var(--glass-cast-2)', ...style,
    }}>{children}</div>
  );
  const Enter = ({ children, i = 0, style }) => (
    <div style={{ animation: 'ag-condense var(--dur-slow) var(--ease-glass) both', animationDelay: (i * 40) + 'ms', minWidth: 0, ...style }}>{children}</div>
  );

  function HostBlock({ compact }) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)' }}>
        <span aria-hidden="true" style={{
          display: 'grid', placeItems: 'center', width: compact ? 36 : 44, height: compact ? 36 : 44, flex: '0 0 auto', borderRadius: '50%',
          backgroundImage: 'var(--glass-fill-3)', boxShadow: 'var(--glass-rim-2), var(--glass-cast-1)',
          color: 'var(--fg-1)', font: 'var(--type-label)', letterSpacing: '0.04em',
        }}>{HOST.initials}</span>
        <span style={{ display: 'grid', gap: 1, minWidth: 0 }}>
          <span style={{ font: 'var(--type-label)', color: 'var(--fg-1)' }}>{HOST.business}</span>
          <span style={{ font: 'var(--type-caption)', color: 'var(--fg-3)' }}>with {HOST.person}</span>
        </span>
      </div>
    );
  }

  function Meta({ zone, onZone }) {
    return (
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 'var(--sp-3) var(--sp-5)', alignItems: 'center' }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 'var(--sp-3)', color: 'var(--fg-2)' }}>
          <Icon name="clock" size={16} /><Mono color="var(--fg-2)">{EVENT.dur} min</Mono>
        </span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 'var(--sp-3)', color: 'var(--fg-2)', font: 'var(--type-body)', fontSize: 'var(--text-sm)' }}>
          <Icon name="video" size={16} />{EVENT.where}
        </span>
        {onZone && (
          <MorphMenu width={240} header={{ title: 'Show times in', meta: 'Detected: London' }}
            trigger={
              <button type="button" style={{
                display: 'inline-flex', alignItems: 'center', gap: 'var(--sp-3)', height: 36, padding: '0 var(--sp-4)', border: 0, backgroundColor: 'transparent', cursor: 'pointer',
                borderRadius: 'var(--r-pill)', backgroundImage: 'var(--glass-fill-1)', boxShadow: 'var(--glass-rim-1)', color: 'var(--fg-1)',
                font: 'var(--type-body)', fontSize: 'var(--text-sm)',
              }}>
                <Icon name="globe" size={16} />{zone.label} time<Icon name="chevron-down" size={14} />
              </button>
            }
            items={ZONES.map((z) => ({ value: z.value, label: z.label, meta: z.abbr, icon: <Icon name={z.value === zone.value ? 'check' : 'map-pin'} size={16} />, onSelect: () => onZone(z) }))} />
        )}
      </div>
    );
  }

  function Header({ zone, onZone, title = EVENT.name, sub = EVENT.about }) {
    return (
      <div style={{ display: 'grid', gap: 'var(--sp-6)' }}>
        <HostBlock />
        <div style={{ display: 'grid', gap: 'var(--sp-3)' }}>
          <h1 style={{ font: 'var(--type-display)', fontSize: 'var(--text-3xl)', letterSpacing: 'var(--tracking-display)', color: 'var(--fg-1)', margin: 0, textWrap: 'balance' }}>{title}</h1>
          {sub && <P>{sub}</P>}
        </div>
        {zone && <Meta zone={zone} onZone={onZone} />}
      </div>
    );
  }

  function SlotPill({ label, on, onClick, i, struck }) {
    const [h, setH] = React.useState(false);
    return (
      <button type="button" onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} aria-pressed={on}
        style={{
          height: 48, border: 0, backgroundColor: 'transparent', cursor: 'pointer', borderRadius: 'var(--r-pill)',
          backgroundImage: on ? 'var(--glass-frost)' : h ? 'var(--glass-fill-3)' : 'var(--glass-fill-2)',
          boxShadow: on ? 'var(--glass-rim-3), var(--glass-cast-2)' : 'var(--glass-rim-2), var(--glass-cast-1)',
          color: on ? 'var(--fg-on-light)' : 'var(--fg-1)', font: 'var(--type-numeric)', fontSize: 'var(--text-base)', fontVariantNumeric: 'tabular-nums',
          textDecoration: struck ? 'line-through' : 'none', opacity: struck ? 0.5 : 1,
          transition: 'var(--t-hover)', animation: 'ag-condense var(--dur-base) var(--ease-glass) both', animationDelay: (i * 24) + 'ms',
        }}>{label}</button>
    );
  }

  function DateStrip({ day, onDay }) {
    return (
      <div className="ag-scroll" style={{ display: 'flex', gap: 'var(--sp-3)', overflowX: 'auto', margin: '0 calc(-1 * var(--sp-7))', padding: 'var(--sp-2) var(--sp-7)', scrollSnapType: 'x mandatory' }}>
        {DAYS.map((d) => {
          const on = d.key === day, n = d.slots.length;
          return (
            <button key={d.key} type="button" disabled={!n} onClick={() => onDay(d.key)} style={{
              flex: '0 0 auto', width: 58, display: 'grid', justifyItems: 'center', gap: 'var(--sp-2)', padding: 'var(--sp-4) 0 var(--sp-3)',
              border: 0, backgroundColor: 'transparent', borderRadius: 'var(--r-md)', cursor: n ? 'pointer' : 'default', scrollSnapAlign: 'start',
              backgroundImage: on ? 'var(--glass-frost)' : n ? 'var(--glass-fill-1)' : 'none',
              boxShadow: on ? 'var(--glass-rim-3), var(--glass-cast-1)' : n ? 'var(--glass-rim-1)' : 'inset 0 0 0 1px var(--line-faint)',
              color: on ? 'var(--fg-on-light)' : n ? 'var(--fg-1)' : 'var(--fg-4)', transition: 'var(--t-hover)',
            }}>
              <span style={{ font: 'var(--type-caption)', opacity: on ? 0.7 : 1 }}>{d.dow}</span>
              <span style={{ font: 'var(--type-numeric)', fontSize: 'var(--text-lg)' }}>{d.n}</span>
              <span style={{ display: 'flex', gap: 3, height: 5 }}>
                {Array.from({ length: Math.min(3, Math.ceil(n / 2)) }).map((_, i) => (
                  <span key={i} style={{ width: 4, height: 4, borderRadius: '50%', background: on ? 'var(--fg-on-light)' : 'var(--fg-3)' }} />
                ))}
              </span>
            </button>
          );
        })}
      </div>
    );
  }

  function Field({ label, value, onChange, type = 'text', placeholder, area, hint }) {
    const [f, setF] = React.useState(false);
    const Tag = area ? 'textarea' : 'input';
    return (
      <label style={{ display: 'grid', gap: 'var(--sp-3)' }}>
        <span style={{ font: 'var(--type-label)', color: 'var(--fg-2)' }}>{label}{hint && <span style={{ color: 'var(--fg-4)', fontWeight: 'normal' }}> · {hint}</span>}</span>
        <span style={{
          display: 'flex', borderRadius: area ? 'var(--r-md)' : 'var(--r-pill)', backgroundImage: 'var(--glass-well)',
          boxShadow: 'var(--glass-well-shadow)' + (f ? ', 0 0 0 2px var(--accent-hairline)' : ''), transition: 'box-shadow var(--dur-hover) var(--ease-glass)',
        }}>
          <Tag className="b-field" data-ag-field type={type} value={value} placeholder={placeholder} rows={area ? 3 : undefined}
            onFocus={() => setF(true)} onBlur={() => setF(false)} onChange={(e) => onChange(e.target.value)}
            style={{
              flex: 1, minWidth: 0, border: 0, background: 'none', color: 'var(--fg-1)', resize: 'none',
              font: 'var(--type-body)', fontSize: 16, padding: area ? 'var(--sp-4) var(--sp-6)' : '0 var(--sp-6)', height: area ? 'auto' : 48,
            }} />
        </span>
      </label>
    );
  }

  function SlotSummary({ day, t, zone, struck }) {
    const d = DAYS.find((x) => x.key === day);
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-5)' }}>
        <span style={{
          display: 'grid', justifyItems: 'center', width: 56, padding: 'var(--sp-3) 0', flex: '0 0 auto', borderRadius: 'var(--r-md)',
          backgroundImage: 'var(--glass-fill-2)', boxShadow: 'var(--glass-rim-2)',
        }}>
          <Kicker color="var(--fg-3)" style={{ fontSize: 10 }}>{d.mon}</Kicker>
          <Mono size="var(--text-xl)">{d.n}</Mono>
        </span>
        <span style={{ display: 'grid', gap: 2, minWidth: 0 }}>
          <span style={{ font: 'var(--type-label)', fontSize: 'var(--text-base)', color: 'var(--fg-1)', textDecoration: struck ? 'line-through' : 'none' }}>{LONG[d.dow]}</span>
          <Mono color="var(--fg-2)" style={{ textDecoration: struck ? 'line-through' : 'none' }}>{hm(t + zone.off)}–{hm(t + zone.off + EVENT.dur)} <span style={{ color: 'var(--fg-4)' }}>{zone.label}</span></Mono>
        </span>
      </div>
    );
  }

  function Page() {
    const initial = (location.hash || '').slice(1);
    const [screen, setScreen] = React.useState('pick');
    const [zone, setZone] = React.useState(ZONES[0]);
    const [day, setDay] = React.useState('24');
    const [slot, setSlot] = React.useState(null);
    const [booking, setBooking] = React.useState({ day: '24', t: 990 });
    const [name, setName] = React.useState('Anna Keller');
    const [email, setEmail] = React.useState('anna@kellerform.co.uk');
    const [note, setNote] = React.useState('');
    const [sending, setSending] = React.useState(false);
    const [taken, setTaken] = React.useState(false);
    const [confirmCancel, setConfirmCancel] = React.useState(false);
    const [moved, setMoved] = React.useState(false);
    const [notify, setNotify] = React.useState('');
    const [notified, setNotified] = React.useState(false);
    const [w, setW] = React.useState(window.innerWidth);
    const [rail, setRail] = React.useState(false);

    React.useEffect(() => { const on = () => setW(window.innerWidth); window.addEventListener('resize', on); return () => window.removeEventListener('resize', on); }, []);

    React.useEffect(() => { if (STATES.some((g) => g.items.some(([v]) => v === initial))) jump(initial); }, []);

    function jump(v) {
      const hash = v;
      setRail(false); setConfirmCancel(false); setSending(false); setNotified(false); setMoved(false);
      if (v === 'pick') { setSlot(null); setTaken(false); }
      if (v === 'details') { setSlot({ day: '24', t: 990 }); setTaken(false); }
      if (v === 'taken') { setSlot({ day: '24', t: 990 }); setTaken(true); v = 'details'; }
      if (v === 'reschedule') { setSlot(null); setDay('25'); }
      setScreen(v);
      history.replaceState(null, '', '#' + hash);
      window.scrollTo(0, 0);
    }

    function confirm() {
      setSending(true);
      setTimeout(() => {
        setSending(false);
        if (!taken && slot.day === '24' && slot.t === 990 && screen === 'details' && !window.__tookOnce) {
          window.__tookOnce = true; setTaken(true); return;
        }
        setBooking(slot); setTaken(false); setScreen('confirmed'); window.scrollTo(0, 0);
      }, 900);
    }

    const d = DAYS.find((x) => x.key === day);
    const wideRail = w >= 1000;
    const col = { width: '100%', maxWidth: 460, margin: '0 auto', boxSizing: 'border-box', padding: 'max(var(--sp-9), env(safe-area-inset-top)) var(--sp-6) var(--sp-13)', display: 'grid', gap: 'var(--sp-8)', alignContent: 'start' };
    const bookedDay = DAYS.find((x) => x.key === booking.day);
    const cur = screen === 'details' && taken ? 'taken' : screen;

    let body;
    if (screen === 'pick' || screen === 'reschedule') {
      const res = screen === 'reschedule';
      body = (
        <div style={col} key={screen}>
          <Enter><Header zone={zone} onZone={setZone} title={res ? 'Pick a new time' : EVENT.name} sub={res ? null : EVENT.about} /></Enter>
          {res && (
            <Enter i={1}>
              <div style={{ display: 'grid', gap: 'var(--sp-4)', padding: 'var(--sp-5) var(--sp-6)', borderRadius: 'var(--r-card)', backgroundImage: 'var(--glass-fill-1)', boxShadow: 'var(--glass-rim-1)' }}>
                <Kicker>Moving from</Kicker>
                <SlotSummary day={booking.day} t={booking.t} zone={zone} struck />
                <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)' }}>Your current time is kept until you confirm a new one.</span>
              </div>
            </Enter>
          )}
          <Enter i={2}>
            <Pane>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 'var(--sp-4)' }}>
                <span style={{ font: 'var(--type-title)', color: 'var(--fg-1)', flex: 1 }}>{d.mon === 'Sep' ? 'September' : 'October'}</span>
                <Mono size="var(--text-xs)" color="var(--fg-4)">{zone.abbr}</Mono>
              </div>
              <DateStrip day={day} onDay={(k) => { setDay(k); setSlot(null); }} />
              <div style={{ display: 'grid', gap: 'var(--sp-4)' }}>
                <span style={{ font: 'var(--type-label)', color: 'var(--fg-2)' }}>{LONG[d.dow]} {d.n} {d.mon}</span>
                <div key={day + zone.value} style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: 'var(--sp-3)' }}>
                  {d.slots.map((t, i) => (
                    <SlotPill key={t} i={i} label={hm(t + zone.off)} on={slot && slot.day === day && slot.t === t}
                      struck={res && booking.day === day && booking.t === t}
                      onClick={() => setSlot({ day, t })} />
                  ))}
                </div>
              </div>
            </Pane>
          </Enter>
          <div style={{
            position: 'sticky', bottom: 'max(var(--sp-5), env(safe-area-inset-bottom))', zIndex: 5,
            transform: slot ? 'translateY(0)' : 'translateY(12px)', opacity: slot ? 1 : 0, pointerEvents: slot ? 'auto' : 'none',
            transition: 'transform var(--dur-base) var(--ease-glass), opacity var(--dur-base) var(--ease-glass)',
          }}>
            <div style={{
              display: 'flex', alignItems: 'center', gap: 'var(--sp-4)', padding: 'var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-6)',
              borderRadius: 'var(--r-pill)', backgroundColor: 'oklch(0.16 0.004 260 / 0.9)', backgroundImage: 'var(--glass-fill-2)',
              backdropFilter: 'var(--glass-bd-lg)', WebkitBackdropFilter: 'var(--glass-bd-lg)', boxShadow: 'var(--glass-rim-2), var(--glass-cast-3)',
            }}>
              <span style={{ flex: 1, minWidth: 0, display: 'grid' }}>
                {slot && <Mono>{DAYS.find((x) => x.key === slot.day).dow} {DAYS.find((x) => x.key === slot.day).n} · {hm(slot.t + zone.off)}</Mono>}
                <span style={{ font: 'var(--type-caption)', color: 'var(--fg-3)' }}>{zone.label} time</span>
              </span>
              {res
                ? <Button variant="frost" loading={sending} onClick={() => { setSending(true); setTimeout(() => { setSending(false); setBooking(slot); setMoved(true); setScreen('confirmed'); window.scrollTo(0, 0); }, 900); }}>Move here</Button>
                : <Button variant="frost" iconRight={<Icon name="arrow-right" size={16} />} onClick={() => { setTaken(false); setScreen('details'); window.scrollTo(0, 0); }}>Continue</Button>}
            </div>
          </div>
        </div>
      );
    } else if (screen === 'details') {
      const sd = DAYS.find((x) => x.key === slot.day);
      const alts = [{ day: '24', t: 1020 }, { day: '25', t: 900 }, { day: '25', t: 960 }];
      const stillTaken = taken && slot.day === '24' && slot.t === 990;
      body = (
        <div style={col} key={'details'}>
          <Enter>
            <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)' }}>
              <IconButton label="Back to times" variant="glass" onClick={() => { setScreen('pick'); setDay(slot.day); }}><Icon name="arrow-left" size={18} /></IconButton>
              <HostBlock compact />
            </div>
          </Enter>
          {taken && (
            <Enter i={1}>
              <Pane tint="var(--glass-tint-amber)" style={{ gap: 'var(--sp-5)' }}>
                <div style={{ display: 'flex', gap: 'var(--sp-4)', alignItems: 'flex-start' }}>
                  <span style={{ display: 'flex', color: 'var(--status-review)', marginTop: 3 }}><Icon name="calendar-x" size={18} /></span>
                  <span style={{ display: 'grid', gap: 'var(--sp-2)' }}>
                    <span style={{ font: 'var(--type-title)', fontSize: 'var(--text-lg)', color: 'var(--fg-1)' }}>{hm(990 + zone.off)} on Thursday just went.</span>
                    <P color="var(--fg-2)">Someone confirmed it while you were filling this in. Your details are kept — pick the nearest time instead.</P>
                  </span>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: 'var(--sp-3)' }}>
                  {alts.map((a, i) => {
                    const ad = DAYS.find((x) => x.key === a.day);
                    const on = slot.day === a.day && slot.t === a.t;
                    return (
                      <button key={i} type="button" onClick={() => setSlot(a)} style={{
                        display: 'grid', justifyItems: 'center', gap: 2, padding: 'var(--sp-3) 0', border: 0, backgroundColor: 'transparent', cursor: 'pointer', borderRadius: 'var(--r-md)',
                        backgroundImage: on ? 'var(--glass-frost)' : 'var(--glass-fill-2)', boxShadow: on ? 'var(--glass-rim-3), var(--glass-cast-1)' : 'var(--glass-rim-2)',
                        color: on ? 'var(--fg-on-light)' : 'var(--fg-1)', transition: 'var(--t-hover)',
                        animation: 'ag-condense var(--dur-base) var(--ease-glass) both', animationDelay: (i * 24 + 120) + 'ms',
                      }}>
                        <span style={{ font: 'var(--type-caption)', opacity: 0.75 }}>{ad.dow} {ad.n}</span>
                        <span style={{ font: 'var(--type-numeric)', fontSize: 'var(--text-base)' }}>{hm(a.t + zone.off)}</span>
                      </button>
                    );
                  })}
                </div>
                <a href="#pick" onClick={(e) => { e.preventDefault(); setScreen('pick'); setDay('24'); }} style={{ font: 'var(--type-caption)', justifySelf: 'start' }}>See every open time</a>
              </Pane>
            </Enter>
          )}
          <Enter i={2}>
            <Pane>
              <div style={{ display: 'grid', gap: 'var(--sp-4)' }}>
                <span style={{ font: 'var(--type-title)', color: 'var(--fg-1)' }}>{EVENT.name}</span>
                <SlotSummary day={slot.day} t={slot.t} zone={zone} struck={stillTaken} />
              </div>
              <span style={{ height: 1, background: 'var(--line-faint)' }} />
              <Field label="Name" value={name} onChange={setName} placeholder="Your name" />
              <Field label="Email" type="email" value={email} onChange={setEmail} placeholder="you@company.com" hint="the invite goes here" />
              <Field label="Anything to know first" value={note} onChange={setNote} placeholder="A line about the project" area hint="optional" />
              <Button variant="frost" size="lg" block loading={sending} disabled={stillTaken || !name || !email} onClick={confirm}>
                {stillTaken ? 'Pick another time' : 'Confirm ' + sd.dow + ' ' + sd.n + ', ' + hm(slot.t + zone.off)}
              </Button>
              <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)', textAlign: 'center', textWrap: 'pretty' }}>
                You can move or cancel up to 12 hours before.
              </span>
            </Pane>
          </Enter>
        </div>
      );
    } else if (screen === 'confirmed' || screen === 'manage') {
      const conf = screen === 'confirmed';
      body = (
        <div style={col} key={screen}>
          <Enter><HostBlock /></Enter>
          <Enter i={1}>
            <div style={{ display: 'grid', gap: 'var(--sp-5)', justifyItems: conf ? 'center' : 'start', textAlign: conf ? 'center' : 'left' }}>
              {conf && (
                <span style={{
                  display: 'grid', placeItems: 'center', width: 64, height: 64, borderRadius: '50%',
                  backgroundImage: 'var(--glass-tint-accent)', boxShadow: 'var(--glass-rim-2), var(--glow-accent-md)', color: 'var(--accent)',
                  animation: 'ag-ripple 1 var(--dur-sheet) var(--ease-glass)',
                }}><Icon name="check" size={28} /></span>
              )}
              <h1 style={{ font: 'var(--type-display)', fontSize: 'var(--text-3xl)', letterSpacing: 'var(--tracking-display)', color: 'var(--fg-1)', margin: 0, textWrap: 'balance' }}>
                {conf ? (moved ? 'Moved. See you ' + LONG[bookedDay.dow] + '.' : 'Booked. See you ' + LONG[bookedDay.dow] + '.') : 'Your booking'}
              </h1>
              <P>{conf ? 'The invite and the Meet link are on their way to ' + email + '.' : 'Hi ' + name.split(' ')[0] + '. Here is what you have with ' + HOST.person + '.'}</P>
            </div>
          </Enter>
          <Enter i={2}>
            <Pane>
              <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)' }}>
                <span style={{ font: 'var(--type-title)', color: 'var(--fg-1)', flex: 1 }}>{EVENT.name}</span>
                <Mono size="var(--text-xs)" color="var(--fg-3)">{EVENT.dur} min</Mono>
              </div>
              <SlotSummary day={booking.day} t={booking.t} zone={zone} />
              <div style={{ display: 'grid', gap: 'var(--sp-3)' }}>
                {[['video', EVENT.where + ' — link in the invite'], ['user', 'With ' + HOST.person + ', ' + HOST.business]].map(([ic, t]) => (
                  <span key={ic} style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)', color: 'var(--fg-3)', font: 'var(--type-body)', fontSize: 'var(--text-sm)' }}>
                    <Icon name={ic} size={16} />{t}
                  </span>
                ))}
              </div>
              {conf && (
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0,1fr))', gap: 'var(--sp-3)' }}>
                  <Button variant="glass" iconLeft={<Icon name="calendar-plus" size={16} />}>Google</Button>
                  <Button variant="glass" iconLeft={<Icon name="download" size={16} />}>Apple · Outlook</Button>
                </div>
              )}
              <span style={{ height: 1, background: 'var(--line-faint)' }} />
              {!confirmCancel ? (
                <div style={{ display: 'grid', gap: 'var(--sp-4)' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0,1fr))', gap: 'var(--sp-3)' }}>
                    <Button variant={conf ? 'ghost' : 'frost'} iconLeft={<Icon name="calendar-sync" size={16} />} onClick={() => { setSlot(null); setDay(booking.day); setScreen('reschedule'); window.scrollTo(0, 0); }}>Reschedule</Button>
                    <Button variant="ghost" iconLeft={<Icon name="x" size={16} />} onClick={() => setConfirmCancel(true)}>Cancel</Button>
                  </div>
                  <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)', textAlign: 'center' }}>
                    Changes close 12 hours before. After that, write to {HOST.person}.
                  </span>
                </div>
              ) : (
                <div style={{ display: 'grid', gap: 'var(--sp-4)', padding: 'var(--sp-5)', borderRadius: 'var(--r-card)', backgroundImage: 'var(--glass-tint-rose)', boxShadow: 'var(--glass-rim-1)', animation: 'ag-condense var(--dur-base) var(--ease-glass) both' }}>
                  <span style={{ font: 'var(--type-label)', color: 'var(--fg-1)' }}>Cancel {bookedDay.dow} {bookedDay.n} {bookedDay.mon}, {hm(booking.t + zone.off)}?</span>
                  <Field label="A reason for Shreekant" value={note} onChange={setNote} placeholder="Optional" />
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0,1fr))', gap: 'var(--sp-3)' }}>
                    <Button variant="solid" tone="rose" onClick={() => { setConfirmCancel(false); setScreen('cancelled'); window.scrollTo(0, 0); }}>Cancel booking</Button>
                    <Button variant="ghost" onClick={() => setConfirmCancel(false)}>Keep it</Button>
                  </div>
                </div>
              )}
            </Pane>
          </Enter>
        </div>
      );
    } else if (screen === 'cancelled') {
      body = (
        <div style={col} key="cancelled">
          <Enter><HostBlock /></Enter>
          <Enter i={1}>
            <div style={{ display: 'grid', gap: 'var(--sp-4)' }}>
              <h1 style={{ font: 'var(--type-display)', fontSize: 'var(--text-3xl)', letterSpacing: 'var(--tracking-display)', color: 'var(--fg-1)', margin: 0 }}>Cancelled.</h1>
              <P>{HOST.person} has been told, and the invite is withdrawn from your calendar.</P>
            </div>
          </Enter>
          <Enter i={2}>
            <Pane>
              <SlotSummary day={booking.day} t={booking.t} zone={zone} struck />
              <Button variant="frost" block iconLeft={<Icon name="calendar-plus" size={16} />} onClick={() => jump('pick')}>Book another time</Button>
            </Pane>
          </Enter>
        </div>
      );
    } else if (screen === 'noslots') {
      body = (
        <div style={col} key="noslots">
          <Enter><Header zone={zone} onZone={setZone} /></Enter>
          <Enter i={1}>
            <Pane>
              <div style={{ display: 'grid', justifyItems: 'center', gap: 'var(--sp-4)', textAlign: 'center', padding: 'var(--sp-5) 0' }}>
                <span style={{ display: 'grid', placeItems: 'center', width: 52, height: 52, borderRadius: '50%', backgroundImage: 'var(--glass-fill-1)', boxShadow: 'var(--glass-rim-1)', color: 'var(--fg-3)' }}>
                  <Icon name="calendar-off" size={22} />
                </span>
                <span style={{ font: 'var(--type-title)', fontSize: 'var(--text-lg)', color: 'var(--fg-1)' }}>No open times in the next three weeks.</span>
                <P style={{ maxWidth: '32ch' }}>New times are added most Mondays. Leave your email and you will hear first.</P>
              </div>
              {notified ? (
                <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)', padding: 'var(--sp-5) var(--sp-6)', borderRadius: 'var(--r-pill)', backgroundImage: 'var(--glass-tint-accent)', boxShadow: 'var(--glass-rim-1)', animation: 'ag-condense var(--dur-base) var(--ease-glass) both' }}>
                  <span style={{ display: 'flex', color: 'var(--accent)' }}><Icon name="bell-ring" size={16} /></span>
                  <span style={{ font: 'var(--type-body)', fontSize: 'var(--text-sm)', color: 'var(--fg-1)' }}>You will get one email when times open.</span>
                </div>
              ) : (
                <div style={{ display: 'grid', gap: 'var(--sp-4)' }}>
                  <Field label="Email" type="email" value={notify} onChange={setNotify} placeholder="you@company.com" />
                  <Button variant="frost" block iconLeft={<Icon name="bell" size={16} />} disabled={!notify} onClick={() => setNotified(true)}>Tell me when times open</Button>
                </div>
              )}
              <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)', textAlign: 'center' }}>
                Can't wait? Write to <a href={'mailto:' + HOST.email}>{HOST.email}</a>
              </span>
            </Pane>
          </Enter>
        </div>
      );
    } else if (screen === 'off') {
      body = (
        <div style={col} key="off">
          <Enter><HostBlock /></Enter>
          <Enter i={1}>
            <div style={{ display: 'grid', gap: 'var(--sp-4)' }}>
              <h1 style={{ font: 'var(--type-display)', fontSize: 'var(--text-3xl)', letterSpacing: 'var(--tracking-display)', color: 'var(--fg-1)', margin: 0, textWrap: 'balance' }}>This link is no longer taking bookings.</h1>
              <P>{HOST.person} has closed it. Nothing is wrong on your side.</P>
            </div>
          </Enter>
          <Enter i={2}>
            <Pane>
              <div style={{ display: 'flex', gap: 'var(--sp-4)', alignItems: 'flex-start' }}>
                <span style={{ display: 'flex', color: 'var(--fg-3)', marginTop: 2 }}><Icon name="mail" size={16} /></span>
                <span style={{ display: 'grid', gap: 'var(--sp-2)' }}>
                  <span style={{ font: 'var(--type-label)', color: 'var(--fg-1)' }}>Already booked?</span>
                  <P>It still stands. Use the link in your confirmation email to move or cancel it.</P>
                </span>
              </div>
              <Button variant="frost" block iconLeft={<Icon name="send" size={16} />} onClick={() => { location.href = 'mailto:' + HOST.email; }}>Write to {HOST.person}</Button>
            </Pane>
          </Enter>
        </div>
      );
    }

    const railList = (
      <div style={{ display: 'grid', gap: 'var(--sp-6)' }}>
        {STATES.map((g) => (
          <div key={g.group} style={{ display: 'grid', gap: 'var(--sp-2)' }}>
            <Kicker style={{ padding: '0 var(--sp-4) var(--sp-2)' }}>{g.group}</Kicker>
            {g.items.map(([v, l]) => (
              <button key={v} type="button" onClick={() => jump(v)} style={{
                display: 'flex', alignItems: 'center', height: 36, padding: '0 var(--sp-4)', border: 0, backgroundColor: 'transparent', cursor: 'pointer', textAlign: 'left',
                borderRadius: 'var(--r-pill)', backgroundImage: cur === v ? 'var(--glass-fill-2)' : 'none',
                boxShadow: cur === v ? 'var(--glass-rim-2)' : 'none', color: cur === v ? 'var(--fg-1)' : 'var(--fg-3)',
                font: 'var(--type-body)', fontSize: 'var(--text-sm)', transition: 'var(--t-hover)',
              }}>{l}</button>
            ))}
          </div>
        ))}
        <a href="booking.html" style={{ font: 'var(--type-caption)', padding: '0 var(--sp-4)', justifySelf: 'start' }}>Your side: links and rules</a>
      </div>
    );

    return (
      <div style={{ minHeight: '100vh' }}>
        <GlassFilters />
        {body}
        {/* Spec harness — not part of the client's page. */}
        {wideRail ? (
          <aside style={{
            position: 'fixed', top: 'var(--sp-9)', left: 'var(--sp-7)', width: 200, padding: 'var(--sp-5) var(--sp-3)',
            borderRadius: 'var(--r-card)', backgroundImage: 'var(--glass-fill-1)', boxShadow: 'var(--glass-rim-1)',
            backdropFilter: 'var(--glass-bd-md)', WebkitBackdropFilter: 'var(--glass-bd-md)',
          }}>{railList}</aside>
        ) : (
          <div style={{ position: 'fixed', top: 'var(--sp-5)', right: 'var(--sp-5)', zIndex: 60 }}>
            <IconButton label="Spec states" variant="glass" active={rail} onClick={() => setRail(!rail)}><Icon name={rail ? 'x' : 'layers'} size={18} /></IconButton>
            {rail && (
              <div style={{
                position: 'absolute', right: 0, top: 52, width: 220, padding: 'var(--sp-5) var(--sp-3)', borderRadius: 'var(--r-card)',
                backgroundColor: 'oklch(0.145 0.004 260 / 0.96)', backgroundImage: 'var(--glass-fill-1)', boxShadow: 'var(--glass-rim-2), var(--glass-cast-3)',
                animation: 'ag-unfurl var(--dur-base) var(--ease-glass) both',
              }}>{railList}</div>
            )}
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
});
</script>
</body>
</html>
