<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASE — Focus</title>
<link rel="icon" href="../assets/favicon.svg">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<script src="../_ds_loader.js"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; }

  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-hairline); }
  a:hover { color: var(--accent-lift); border-bottom-color: var(--accent-lift); }

  .ag-field::placeholder { color: var(--fg-4); opacity: 1; }
  .ag-field:focus { outline: none; }
  .ag-scroll { scrollbar-width: none; -ms-overflow-style: none; }
  .ag-scroll::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body class="ag-page ag-page--focal" data-screen-label="Focus">
<div id="root">
  <div style="display:flex;min-height:100vh">
    <div style="width:104px;flex:0 0 auto"></div>
    <div style="flex:1;min-width:0;padding:var(--sp-9) var(--gutter-page);display:grid;gap:var(--sp-8);justify-items:center">
      <div style="height:64px;width:100%;border-radius:var(--r-pill);background-image:var(--glass-fill-1);box-shadow:var(--glass-rim-1)"></div>
      <div style="height:56vh;width:min(760px,100%);border-radius:var(--r-card-lg);background-image:var(--glass-fill-1);box-shadow:var(--glass-rim-1)"></div>
    </div>
  </div>
</div>
<script type="text/ag-jsx">
AG_LOAD([
  '../components/material/GlassFilters.jsx',
  '../components/core/Icon.jsx',
  '../components/actions/Button.jsx',
  '../components/actions/IconButton.jsx',
  '../components/forms/Checkbox.jsx',
  '../components/data/ScoreDial.jsx',
  '../components/data/Countdown.jsx',
  '../components/feedback/Toast.jsx',
  '../components/navigation/MiniNav.jsx',
  '../components/navigation/Stepper.jsx'
]).then(function (AG) {
  const { GlassFilters, Icon, Button, IconButton, Checkbox, ScoreDial, Countdown, Toast, MiniNav, Stepper } = AG;

  /* ------------------------------------------------------------------ *
     THE SCREEN'S ONE JOB

     Everything is decided. This screen holds exactly one task in front
     of you and counts. The product's whole question collapses to two
     numerals: how long on THIS, how long on the SESSION.

     What the old screen got wrong, and what replaces it:

       1. Details and Subtasks opened sheets that blurred and covered the
          task they described — you lost the thing you were working on to
          read about it. They now DOCK beside the stage: the card slides
          left, the panel grows out of the pill you pressed, and both
          stay legible. Nothing is ever hidden behind its own annotation.
       2. Defer emptied the screen and left a toast on a black field.
          Defer is a queue operation, so it advances to the next task and
          the toast only confirms what already visibly happened.
       3. The session budget was a static label. It is a live bar here,
          segmented by task, so "04:00:00 remaining" has a shape.
       4. Three same-weight buttons competed. One frost verb (Done), one
          glass verb (Pause), one ghost escape (End) — and Defer sits a
          step below because it is a decision, not a control.
   * ------------------------------------------------------------------ */

  const NAV = [
    { value: 'dashboard', label: 'Dashboard',     icon: 'layout-dashboard', href: 'home.html' },
    { value: 'home',      label: 'Home',          icon: 'house',            href: 'home.html' },
    { value: 'assistant', label: 'Assistant',     icon: 'sparkles',         href: 'atlas.html' },
    { value: 'session',   label: 'New Session',   icon: 'zap' },
    { value: 'score',     label: 'Score',         icon: 'award', badge: 6,  href: 'scoring.html' },
    { value: 'alerts',    label: 'Notifications', icon: 'bell',             href: 'home.html' },
    { value: 'settings',  label: 'Settings',      icon: 'settings',         href: 'settings.html' },
  ];

  const LISTS = ['\u26a1 Action Steps', '\ud83e\uddca Backburner', '\ud83d\udcda Reference Materials', 'Build', 'Operations', 'Money'];

  /* The queue handed over by Deadlines — same three tasks, same
     allocations, same scores. Nothing on this screen invents data. */
  const QUEUE = [
    {
      id: 'inc', title: 'File the incorporation paperwork', list: 'Operations',
      score: 11.0, alloc: 90, due: '2026-08-22T06:00', tags: ['legal', 'blocking'],
      desc: 'Form INC-32 plus the MOA and AOA. The CA has the drafts; they need signing and uploading.',
      subs: [
        { id: 'moa', title: 'Sign the MOA', alloc: 15, done: true, kids: [] },
        { id: 'aoa', title: 'Sign the AOA', alloc: 15, done: true, kids: [] },
        { id: 'cert', title: 'Certify the signed set', alloc: 20, done: false, kids: [
          { id: 'scan', title: 'Scan the signed pages', alloc: 10, done: false },
          { id: 'sig', title: 'Attach the digital signature', alloc: 10, done: false },
        ] },
      ],
    },
    {
      id: 'copy', title: 'Rewrite the landing page copy', list: 'Build',
      score: 7.5, alloc: 150, due: '2026-09-19T18:00', tags: ['marketing'],
      desc: 'Hero, three proof blocks, one call to action. Ship the draft to review, not to production.',
      subs: [],
    },
    {
      id: 'mca', title: 'Upload to the MCA portal', list: 'Operations',
      score: 4.0, alloc: 30, due: '2026-08-22T06:00', tags: ['legal'], after: 'File the incorporation paperwork',
      desc: 'Portal accepts the signed set only after the certification step clears.',
      subs: [],
    },
  ];

  const WINDOW_MIN = 240;
  const NOW = new Date('2026-08-21T09:00');
  const DAY = 86400000;
  const pad = (n) => (n < 10 ? '0' + n : String(n));

  const mins = (m) => {
    m = Math.max(0, Math.round(m));
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60), r = m % 60;
    return h + 'h' + (r ? ' ' + r + 'm' : '');
  };

  const hms = (s) => {
    s = Math.max(0, Math.round(s));
    return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
  };

  const clock = (total) => pad(Math.floor(total / 60) % 24) + ':' + pad(Math.round(total) % 60);

  const dueText = (iso) => {
    if (!iso) return null;
    const days = (new Date(iso) - NOW) / DAY;
    if (days < 0) return { text: 'Overdue', hot: true };
    if (days <= 1) return { text: 'Due in ' + Math.max(1, Math.round(days * 24)) + 'h', hot: true };
    if (days <= 7) return { text: 'Due in ' + Math.ceil(days) + 'd', hot: false };
    return { text: 'Due in ' + Math.round(days / 7) + 'w', hot: false };
  };

  const dueStamp = (iso) => {
    const d = new Date(iso);
    const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return d.getDate() + ' ' + M[d.getMonth()] + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  };

  const leaves = (t) => t.subs.reduce((n, s) => n + 1 + s.kids.length, 0);
  const leavesDone = (t) => t.subs.reduce((n, s) => n + (s.done ? 1 : 0) + s.kids.filter((k) => k.done).length, 0);

  /* ------------------------------------------------------------------ *
     PRIMITIVES — same vocabulary as Deadlines, so the two screens read
     as one product.
   * ------------------------------------------------------------------ */

  function Kicker({ icon, children, tone = 'var(--fg-3)', style }) {
    return (
      <span style={{
        display: 'inline-flex', alignItems: 'center', gap: 'var(--sp-3)',
        font: 'var(--type-kicker)', textTransform: 'uppercase',
        letterSpacing: 'var(--tracking-kicker)', color: tone, whiteSpace: 'nowrap', ...style,
      }}>
        {icon && <Icon name={icon} size={13} />}
        {children}
      </span>
    );
  }

  function Chip({ children, icon, tone, active, onClick }) {
    const [hover, setHover] = React.useState(false);
    const Tag = onClick ? 'button' : 'span';
    const ink = tone === 'amber' ? 'oklch(0.95 0.07 82)'
      : tone === 'cyan' ? 'oklch(0.93 0.07 210)'
      : active ? 'var(--fg-1)' : 'var(--fg-2)';
    return (
      <Tag
        type={onClick ? 'button' : undefined}
        onClick={onClick}
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => setHover(false)}
        style={{
          display: 'inline-flex', alignItems: 'center', gap: 'var(--sp-3)', flex: '0 0 auto',
          height: 28, padding: '0 var(--sp-4)', border: 0, borderRadius: 'var(--r-pill)',
          cursor: onClick ? 'pointer' : 'default',
          backgroundImage: tone === 'amber' ? 'var(--glass-tint-amber)'
            : tone === 'cyan' ? 'var(--glass-tint-cyan)'
            : active ? 'var(--glass-fill-3)' : hover && onClick ? 'var(--glass-fill-2)' : 'var(--glass-fill-1)',
          boxShadow: active ? 'var(--glass-rim-2)' : 'var(--glass-rim-1)',
          color: ink, font: 'var(--type-label)', fontSize: 'var(--text-xs)', whiteSpace: 'nowrap',
          transition: 'var(--t-hover)',
        }}
      >
        {icon && <Icon name={icon} size={13} />}
        {children}
      </Tag>
    );
  }

  const fieldStyle = {
    flex: 1, minWidth: 0, border: 0, outline: 'none', background: 'transparent',
    color: 'var(--fg-1)', font: 'var(--type-body)', fontSize: 'var(--text-sm)',
    letterSpacing: 'var(--tracking-ui)', padding: 0,
  };

  function Well({ children, focus, pad = '0 var(--sp-5)', height = 44, radius = 'var(--r-control)', style }) {
    return (
      <div style={{
        display: 'flex', alignItems: 'center', gap: 'var(--sp-4)',
        minHeight: height, padding: pad, borderRadius: radius,
        backgroundImage: 'var(--glass-well)',
        boxShadow: focus
          ? 'var(--glass-well-shadow), 0 0 0 1px var(--accent-hairline), 0 0 20px -6px oklch(0.70 0.15 162 / 0.5)'
          : 'var(--glass-well-shadow), 0 0 0 1px var(--line-faint)',
        transition: 'box-shadow var(--dur-base) var(--ease-glass)',
        ...style,
      }}>
        {children}
      </div>
    );
  }

  /* The pill that opens a docked panel. It is the panel's origin, so it
     stays lit while the panel is open — the morph has a visible source. */
  function DockPill({ icon, label, count, open, onClick }) {
    const [hover, setHover] = React.useState(false);
    return (
      <button
        type="button"
        onClick={onClick}
        aria-expanded={open}
        onMouseEnter={() => setHover(true)}
        onMouseLeave={() => setHover(false)}
        style={{
          display: 'inline-flex', alignItems: 'center', gap: 'var(--sp-4)',
          height: 44, padding: '0 var(--sp-6)', border: 0, cursor: 'pointer',
          borderRadius: 'var(--r-pill)',
          backgroundImage: open ? 'var(--glass-fill-3)' : hover ? 'var(--glass-fill-2)' : 'var(--glass-fill-1)',
          boxShadow: open ? 'var(--glass-rim-2), var(--glass-cast-1)' : 'var(--glass-rim-1)',
          color: open ? 'var(--fg-1)' : 'var(--fg-2)',
          font: 'var(--type-label)', fontSize: 'var(--text-sm)', whiteSpace: 'nowrap',
          transition: 'var(--t-hover)',
        }}
      >
        <Icon name={icon} size={17} />
        {label}
        {count && (
          <span style={{ font: 'var(--type-numeric)', fontSize: 'var(--text-xs)', color: open ? 'var(--fg-3)' : 'var(--fg-4)', fontVariantNumeric: 'tabular-nums' }}>
            {count}
          </span>
        )}
      </button>
    );
  }

  /* ------------------------------------------------------------------ *
     THE SESSION STRIP — the global budget, given a shape. Each segment
     is a task, sized by its allocation; the live one carries the fill.
   * ------------------------------------------------------------------ */

  function SessionStrip({ segments, left, doneCount, total, onSort, sorted }) {
    const span = segments.reduce((n, s) => n + s.alloc, 0) || 1;
    return (
      <div style={{
        display: 'flex', alignItems: 'center', gap: 'var(--sp-6)', flexWrap: 'wrap', justifyContent: 'center',
        padding: 'var(--sp-4) var(--sp-5) var(--sp-4) var(--sp-7)', borderRadius: 'var(--r-pill)',
        backgroundImage: 'var(--glass-fill-2)',
        backdropFilter: 'var(--glass-bd-lg)', WebkitBackdropFilter: 'var(--glass-bd-lg)',
        boxShadow: 'var(--glass-shadow-pane)',
      }}>
        <div style={{ display: 'grid', gap: 2 }}>
          <Kicker icon="hourglass">Global work session</Kicker>
          <span style={{ display: 'flex', alignItems: 'baseline', gap: 'var(--sp-3)' }}>
            <span style={{
              font: 'var(--type-numeric)', fontSize: 'var(--text-xl)', color: 'var(--fg-1)',
              fontVariantNumeric: 'tabular-nums', letterSpacing: '-0.01em',
            }}>
              {hms(left)}
            </span>
            <span style={{ font: 'var(--type-kicker)', color: 'var(--fg-4)' }}>remaining</span>
          </span>
        </div>

        <span style={{ width: 1, alignSelf: 'stretch', background: 'var(--line-faint)' }} />

        <div style={{ display: 'grid', gap: 'var(--sp-3)', minWidth: 260, flex: 1 }}>
          <div style={{ display: 'flex', gap: 3, height: 10, padding: 2, borderRadius: 'var(--r-pill)', backgroundImage: 'var(--glass-well)', boxShadow: 'var(--glass-well-shadow)' }}>
            {segments.map((s) => (
              <span
                key={s.id}
                title={s.title + ' \u00b7 ' + mins(s.alloc)}
                style={{
                  flex: s.alloc / span, minWidth: 6, borderRadius: 'var(--r-pill)', overflow: 'hidden',
                  backgroundImage: s.state === 'queued' ? 'var(--glass-fill-2)' : 'none',
                  background: s.state === 'done' ? 'oklch(0.70 0.15 162 / 0.42)' : undefined,
                  boxShadow: s.state === 'live' ? 'var(--glow-accent-sm)' : 'none',
                  transition: 'flex var(--dur-slow) var(--ease-glass)',
                }}
              >
                {s.state === 'live' && (
                  <span style={{
                    display: 'block', height: '100%', width: Math.max(2, Math.min(100, s.progress * 100)) + '%',
                    borderRadius: 'var(--r-pill)', background: 'var(--accent)',
                    boxShadow: '0 0 12px -1px var(--accent)', transition: 'width 1s linear',
                  }} />
                )}
              </span>
            ))}
          </div>
          <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)' }}>
            <span style={{ font: 'var(--type-numeric)', fontSize: 'var(--text-2xs)', color: 'var(--fg-3)', fontVariantNumeric: 'tabular-nums' }}>
              {doneCount} / {total} tasks
            </span>
            <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)' }}>run order</span>
          </span>
        </div>

        <Button
          size="sm"
          variant={sorted ? 'tint' : 'glass'}
          tone="cyan"
          iconLeft={<Icon name="arrow-down-wide-narrow" size={15} />}
          onClick={onSort}
        >
          Smart sort
        </Button>
      </div>
    );
  }

  /* ------------------------------------------------------------------ *
     THE DOCKED PANEL — grows out of the pill, beside the stage. Never
     over it: a task you cannot see is a task you cannot work on.
   * ------------------------------------------------------------------ */

  function Panel({ open, title, subtitle, onClose, children, footer }) {
    return (
      <div style={{
        width: open ? 404 : 0,
        opacity: open ? 1 : 0,
        overflow: 'hidden',
        flex: '0 0 auto',
        transition: 'width var(--dur-morph) var(--ease-morph), opacity var(--dur-base) var(--ease-glass)',
      }}>
        <div style={{
          width: 380, marginLeft: 'var(--sp-6)',
          display: 'grid', gap: 'var(--sp-6)', alignContent: 'start',
          padding: 'var(--pad-card)', borderRadius: 'var(--r-card-lg)',
          backgroundImage: 'var(--glass-fill-2)',
          backdropFilter: 'var(--glass-bd-md)', WebkitBackdropFilter: 'var(--glass-bd-md)',
          boxShadow: 'var(--glass-shadow-pane)',
          transform: open ? 'translateX(0)' : 'translateX(-16px)',
          transition: 'transform var(--dur-morph) var(--ease-morph)',
        }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 'var(--sp-4)' }}>
            <div style={{ display: 'grid', gap: 2, flex: 1, minWidth: 0 }}>
              <h2 style={{ margin: 0, font: 'var(--type-title)', fontSize: 'var(--text-lg)', letterSpacing: 'var(--tracking-title)', color: 'var(--fg-1)' }}>
                {title}
              </h2>
              <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)', textWrap: 'pretty' }}>{subtitle}</span>
            </div>
            <IconButton label="Close panel" size="sm" variant="ghost" onClick={onClose}><Icon name="x" size={16} /></IconButton>
          </div>
          {children}
          {footer}
        </div>
      </div>
    );
  }

  function DetailsBody({ task }) {
    const due = dueText(task.due);
    return (
      <React.Fragment>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 'var(--sp-3)' }}>
          <Chip icon="corner-down-right">{task.list}</Chip>
          <Chip icon="calendar-clock" tone={due && due.hot ? 'amber' : null}>{dueStamp(task.due)}</Chip>
          <Chip icon="timer">{mins(task.alloc)}</Chip>
          {task.tags.map((tag) => <Chip key={tag} icon="tag">{tag}</Chip>)}
        </div>

        {task.after && (
          <Well pad="var(--sp-4) var(--sp-5)" height={0} radius="var(--r-md)" style={{ alignItems: 'flex-start' }}>
            <span style={{ display: 'flex', color: 'var(--fg-4)', paddingTop: 1 }}><Icon name="lock" size={15} /></span>
            <span style={{ font: 'var(--type-body)', fontSize: 'var(--text-sm)', color: 'var(--fg-2)', textWrap: 'pretty' }}>
              Runs after {task.after}.
            </span>
          </Well>
        )}

        <div style={{ display: 'grid', gap: 'var(--sp-3)' }}>
          <Kicker icon="align-left">Description</Kicker>
          <Well pad="var(--sp-5)" height={0} radius="var(--r-md)" style={{ alignItems: 'flex-start' }}>
            <span style={{ font: 'var(--type-body)', fontSize: 'var(--text-sm)', color: 'var(--fg-2)', lineHeight: 'var(--leading-normal)', textWrap: 'pretty' }}>
              {task.desc}
            </span>
          </Well>
        </div>

        <div style={{ display: 'grid', gap: 'var(--sp-3)' }}>
          <Kicker icon="award">Priority</Kicker>
          <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)' }}>
            <ScoreDial value={task.score} size="lg" showMax />
            <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)', textWrap: 'pretty' }}>
              {task.quasi ? 'Includes +1 for the quasi-need added on defer.' : 'Scored on the selection screen.'}
            </span>
          </div>
        </div>
      </React.Fragment>
    );
  }

  function SubtasksBody({ task, onToggle }) {
    const total = leaves(task);
    const done = leavesDone(task);
    const row = (node, depth, parentDone) => (
      <div
        key={node.id}
        style={{
          display: 'flex', alignItems: 'center', gap: 'var(--sp-4)',
          marginLeft: depth * 24, minHeight: 44, padding: '0 var(--sp-4)',
          borderRadius: 'var(--r-sm)',
          backgroundImage: node.done ? 'var(--glass-fill-1)' : 'none',
          transition: 'var(--t-hover)',
        }}
      >
        <Checkbox
          checked={node.done}
          onChange={() => onToggle(node.id)}
          size={depth ? 'sm' : 'md'}
          label={node.title}
        />
        <span style={{ flex: 1 }} />
        <span style={{
          font: 'var(--type-numeric)', fontSize: 'var(--text-2xs)',
          color: node.done ? 'var(--accent)' : 'var(--fg-4)', fontVariantNumeric: 'tabular-nums',
        }}>
          {mins(node.alloc)}
        </span>
      </div>
    );

    return (
      <React.Fragment>
        <div style={{ display: 'grid', gap: 'var(--sp-3)' }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 'var(--sp-4)' }}>
            <span style={{ font: 'var(--type-numeric)', fontSize: 'var(--text-lg)', color: 'var(--fg-1)', fontVariantNumeric: 'tabular-nums' }}>
              {done} / {total}
            </span>
            <span style={{ font: 'var(--type-kicker)', color: 'var(--fg-4)' }}>steps done</span>
          </div>
          <div style={{ height: 6, padding: 1, borderRadius: 'var(--r-pill)', backgroundImage: 'var(--glass-well)', boxShadow: 'var(--glass-well-shadow)' }}>
            <span style={{
              display: 'block', height: '100%', width: (total ? (done / total) * 100 : 0) + '%',
              borderRadius: 'var(--r-pill)', background: 'var(--accent)',
              boxShadow: '0 0 12px -2px var(--accent)',
              transition: 'width var(--dur-slow) var(--ease-spring)',
            }} />
          </div>
        </div>

        <div style={{ display: 'grid', gap: 2 }}>
          {task.subs.map((s) => (
            <React.Fragment key={s.id}>
              {row(s, 0)}
              {s.kids.map((k) => row(k, 1))}
            </React.Fragment>
          ))}
        </div>

        {task.subs.length === 0 && (
          <span style={{ font: 'var(--type-body)', fontSize: 'var(--text-sm)', color: 'var(--fg-3)', textWrap: 'pretty' }}>
            No breakdown. This one is a single block of work.
          </span>
        )}

        {total > 0 && done === total && (
          <div style={{
            display: 'flex', alignItems: 'center', gap: 'var(--sp-4)',
            padding: 'var(--sp-5)', borderRadius: 'var(--r-md)',
            backgroundImage: 'var(--glass-tint-accent)', boxShadow: 'var(--glass-rim-2), var(--glow-accent-sm)',
            animation: 'ag-condense var(--dur-base) var(--ease-spring) both',
          }}>
            <span style={{ display: 'flex', color: 'var(--accent)' }}><Icon name="check" size={16} /></span>
            <span style={{ font: 'var(--type-label)', color: 'var(--fg-1)' }}>Every step is closed. Mark the task done.</span>
          </div>
        )}
      </React.Fragment>
    );
  }

  /* ------------------------------------------------------------------ *
     CAPTURE — identical to Deadlines. A thought arriving mid-focus must
     not take the screen away from the task.
   * ------------------------------------------------------------------ */

  function Capture({ onSave }) {
    const [open, setOpen] = React.useState(false);
    const [text, setText] = React.useState('');
    const [list, setList] = React.useState('\u26a1 Action Steps');
    const [hover, setHover] = React.useState(false);
    const ref = React.useRef(null);

    React.useEffect(() => { if (open && ref.current) ref.current.focus(); }, [open]);

    const commit = () => {
      if (!text.trim()) { setOpen(false); return; }
      onSave(text.trim(), list);
      setText('');
      setOpen(false);
    };

    return (
      <div style={{ position: 'fixed', right: 'var(--sp-8)', bottom: 'var(--sp-8)', zIndex: 70 }}>
        {open ? (
          <div style={{
            width: 380, display: 'grid', gap: 'var(--sp-5)', padding: 'var(--sp-7)',
            borderRadius: 'var(--r-xl)',
            backgroundImage: 'var(--glass-fill-3)',
            backdropFilter: 'var(--glass-bd-xl)', WebkitBackdropFilter: 'var(--glass-bd-xl)',
            boxShadow: 'var(--glass-shadow-thick), var(--shadow-4)',
            animation: 'ag-unfurl var(--dur-morph) var(--ease-morph) both',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)' }}>
              <Kicker icon="inbox">Capture</Kicker>
              <span style={{ flex: 1 }} />
              <IconButton label="Close capture" size="sm" variant="ghost" onClick={() => setOpen(false)}><Icon name="x" size={16} /></IconButton>
            </div>

            <Well focus pad="var(--sp-4) var(--sp-5)" height={0} radius="var(--r-lg)">
              <textarea
                ref={ref}
                className="ag-field"
                rows={2}
                value={text}
                onChange={(e) => setText(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(); }
                  if (e.key === 'Escape') { e.preventDefault(); setOpen(false); }
                }}
                placeholder="It lands in the list, not in this session."
                aria-label="Capture a task"
                style={Object.assign({}, fieldStyle, { resize: 'none', width: '100%', lineHeight: 'var(--leading-normal)' })}
              />
            </Well>

            <div className="ag-scroll" style={{ display: 'flex', gap: 'var(--sp-3)', overflowX: 'auto', paddingBottom: 2 }}>
              {LISTS.map((l) => (
                <Chip key={l} active={list === l} onClick={() => setList(l)}>{l}</Chip>
              ))}
            </div>

            <Button variant="frost" block onClick={commit} iconRight={<Icon name="corner-down-left" size={16} />}>Save task</Button>
          </div>
        ) : (
          <button
            type="button"
            aria-label="Capture a task"
            onClick={() => setOpen(true)}
            onMouseEnter={() => setHover(true)}
            onMouseLeave={() => setHover(false)}
            style={{
              display: 'grid', placeItems: 'center', width: 60, height: 60, padding: 0, border: 0,
              cursor: 'pointer', borderRadius: 'var(--r-pill)',
              backgroundImage: 'var(--glass-fill-3)',
              backdropFilter: 'var(--glass-bd-lg)', WebkitBackdropFilter: 'var(--glass-bd-lg)',
              boxShadow: hover
                ? 'var(--glass-rim-2), var(--shadow-4), var(--glow-white-sm)'
                : 'var(--glass-rim-2), var(--shadow-3)',
              color: 'var(--fg-1)',
              transform: hover ? 'scale(1.04)' : 'scale(1)',
              transition: 'var(--t-hover)',
            }}
          >
            <Icon name="plus" size={24} />
          </button>
        )}
      </div>
    );
  }

  /* ------------------------------------------------------------------ *
     THE SCREEN
   * ------------------------------------------------------------------ */

  function Focus() {
    const [queue, setQueue] = React.useState(QUEUE);
    const [log, setLog] = React.useState([]);
    const [left, setLeft] = React.useState(QUEUE[0].alloc * 60);
    const [sessionLeft, setSessionLeft] = React.useState(WINDOW_MIN * 60);
    const [running, setRunning] = React.useState(true);
    const [panel, setPanel] = React.useState(null);
    const [confirmEnd, setConfirmEnd] = React.useState(false);
    const [sorted, setSorted] = React.useState(false);
    const [ended, setEnded] = React.useState(false);
    const [toast, setToast] = React.useState(null);
    const [wide, setWide] = React.useState(window.innerWidth >= 1180);

    React.useEffect(() => {
      const onResize = () => setWide(window.innerWidth >= 1180);
      window.addEventListener('resize', onResize);
      return () => window.removeEventListener('resize', onResize);
    }, []);

    React.useEffect(() => {
      if (!running || ended) return undefined;
      const id = window.setInterval(() => {
        setLeft((s) => s - 1);
        setSessionLeft((s) => Math.max(0, s - 1));
      }, 1000);
      return () => window.clearInterval(id);
    }, [running, ended]);

    const say = (title, detail, tone) => {
      setToast({ title, detail, tone: tone || 'accent' });
      window.setTimeout(() => setToast(null), 3200);
    };

    const task = queue[0] || null;
    const over = left < 0;
    const spent = task ? task.alloc * 60 - left : 0;
    const done = log.length;
    const totalTasks = log.length + queue.length;

    const segments = log.map((t) => ({ id: 'l' + t.id, title: t.title, alloc: t.alloc, state: 'done' }))
      .concat(queue.map((t, i) => ({
        id: t.id, title: t.title, alloc: t.alloc,
        state: i === 0 ? 'live' : 'queued',
        progress: i === 0 && t.alloc ? Math.min(1, Math.max(0, spent / (t.alloc * 60))) : 0,
      })));

    const advance = (next) => {
      setQueue(next);
      setPanel(null);
      setConfirmEnd(false);
      if (next.length) setLeft(next[0].alloc * 60);
      else setEnded(true);
    };

    const markDone = () => {
      if (!task) return;
      const used = Math.max(0, Math.round(spent / 60));
      setLog(log.concat([Object.assign({}, task, { used })]));
      advance(queue.slice(1));
      say('Logged.', mins(used) + ' on ' + task.title + ' \u00b7 ' + (over ? mins(-left / 60) + ' over' : mins(left / 60) + ' under'));
    };

    const defer = () => {
      if (!task) return;
      const moved = Object.assign({}, task, { quasi: true, score: task.score + 1 });
      advance(queue.slice(1).concat([moved]));
      say('Deferred.', '+1 quasi-need \u00b7 moved to the end of the queue', 'review');
    };

    const extend = (m) => {
      if (!task) return;
      setQueue(queue.map((t, i) => (i === 0 ? Object.assign({}, t, { alloc: t.alloc + m }) : t)));
      setLeft((s) => s + m * 60);
    };

    const toggleSub = (nodeId) => setQueue(queue.map((t, i) => (i !== 0 ? t : Object.assign({}, t, {
      subs: t.subs.map((s) => (s.id === nodeId
        ? Object.assign({}, s, { done: !s.done })
        : Object.assign({}, s, { kids: s.kids.map((k) => (k.id === nodeId ? Object.assign({}, k, { done: !k.done }) : k)) }))),
    }))));

    const smartSort = () => {
      if (queue.length < 3) return;
      const rest = queue.slice(1).slice().sort((a, b) => b.score - a.score);
      setQueue([queue[0]].concat(rest));
      setSorted(true);
      say('Queue re-sorted.', 'Highest score runs next \u00b7 the live task never moves', 'neutral');
    };

    const navItems = NAV.map((n) => ({ value: n.value, label: n.label, icon: <Icon name={n.icon} size={20} />, badge: n.badge }));
    const go = (v) => { const hit = NAV.find((n) => n.value === v); if (hit && hit.href) location.href = hit.href; };

    const usedTotal = log.reduce((n, t) => n + t.used, 0);
    const subsTotal = task ? leaves(task) : 0;
    const subsDone = task ? leavesDone(task) : 0;

    return (
      <div style={{ display: 'flex', minHeight: '100vh', alignItems: 'flex-start' }}>
        <GlassFilters />

        <div style={{ position: 'sticky', top: 'var(--sp-9)', flex: '0 0 auto', padding: wide ? 'var(--sp-9) 0 var(--sp-9) var(--sp-7)' : 'var(--sp-6) 0 var(--sp-6) var(--sp-5)', zIndex: 40 }}>
          <MiniNav orientation="vertical" items={navItems} value="session" onChange={go} />
        </div>

        <div style={{
          flex: 1, minWidth: 0, display: 'grid', gap: 'var(--sp-8)', justifyItems: 'center',
          padding: wide ? 'var(--sp-9) var(--gutter-page) var(--sp-13)' : 'var(--sp-8) var(--gutter-page-sm) var(--sp-13)',
        }}>
          <header style={{
            width: '100%',
            display: 'flex', alignItems: 'center', gap: 'var(--sp-6)', flexWrap: 'wrap',
            padding: 'var(--sp-4) var(--sp-6) var(--sp-4) var(--sp-4)', borderRadius: 'var(--r-pill)',
            backgroundImage: 'var(--glass-fill-2)',
            backdropFilter: 'var(--glass-bd-lg)', WebkitBackdropFilter: 'var(--glass-bd-lg)',
            boxShadow: 'var(--glass-shadow-pane)',
          }}>
            <a href="deadlines.html" style={{ display: 'flex', border: 0 }} aria-label="Back to allocation">
              <IconButton label="Back to allocation" variant="ghost"><Icon name="arrow-left" size={18} /></IconButton>
            </a>
            <div style={{ display: 'grid', gap: 2, minWidth: 0 }}>
              <span style={{ font: 'var(--type-system)', textTransform: 'uppercase', letterSpacing: 'var(--tracking-system)', color: 'var(--fg-1)', whiteSpace: 'nowrap' }}>
                Focus
              </span>
              <span style={{ font: 'var(--type-caption)', color: 'var(--fg-3)' }}>Strict focus. One task at a time.</span>
            </div>
            <span style={{ flex: 1, minWidth: 'var(--sp-8)' }} />
            <Stepper current={2} steps={[{ label: 'Select' }, { label: 'Deadlines' }, { label: 'Focus' }]} style={{ margin: 0 }} />
          </header>

          {!ended && (
            <div style={{ width: '100%', maxWidth: panel ? 1200 : 860, transition: 'max-width var(--dur-morph) var(--ease-morph)' }}>
              <SessionStrip
                segments={segments}
                left={sessionLeft}
                doneCount={done}
                total={totalTasks}
                sorted={sorted}
                onSort={smartSort}
              />
            </div>
          )}

          {/* ============ THE STAGE ============ */}
          {task && !ended && (
            <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'center', width: '100%' }}>
              <div style={{
                width: '100%', maxWidth: 780, minWidth: 0,
                display: 'grid', gap: 'var(--sp-7)', justifyItems: 'center',
                padding: 'var(--sp-10) var(--pad-card-lg) var(--sp-9)',
                borderRadius: 'var(--r-card-lg)',
                backgroundImage: 'var(--glass-fill-2)',
                backdropFilter: 'var(--glass-bd-lg)', WebkitBackdropFilter: 'var(--glass-bd-lg)',
                boxShadow: over
                  ? 'var(--glass-shadow-pane), var(--glow-rose-md)'
                  : running ? 'var(--glass-shadow-pane), var(--glow-accent-sm)' : 'var(--glass-shadow-pane)',
                transition: 'box-shadow var(--dur-slow) var(--ease-glass)',
              }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-5)', flexWrap: 'wrap', justifyContent: 'center' }}>
                  <Kicker
                    icon={running && !over ? 'circle-dot' : over ? 'triangle-alert' : 'pause'}
                    tone={over ? 'var(--status-overrun)' : running ? 'var(--accent)' : 'var(--fg-3)'}
                    style={over || running ? { animation: 'ag-pulse 2.6s var(--ease-in-out) infinite' } : null}
                  >
                    {over ? 'Overrunning' : running ? 'Running' : 'Paused'}
                  </Kicker>
                  <ScoreDial value={task.score} size="sm" showMax label="priority" />
                  <Kicker tone="var(--fg-4)">{task.list}</Kicker>
                  {task.quasi && <Kicker icon="zap" tone="var(--hue-amber)">Quasi-need</Kicker>}
                </div>

                <h1 style={{
                  margin: 0, maxWidth: '18ch', textAlign: 'center', textWrap: 'balance',
                  font: 'var(--type-display)', fontSize: 'var(--text-4xl)',
                  letterSpacing: 'var(--tracking-display)', color: 'var(--fg-1)',
                }}>
                  {task.title}
                </h1>

                <div style={{ display: 'flex', gap: 'var(--sp-4)', flexWrap: 'wrap', justifyContent: 'center' }}>
                  <DockPill
                    icon="file-text"
                    label="Details"
                    open={panel === 'details'}
                    onClick={() => setPanel(panel === 'details' ? null : 'details')}
                  />
                  <DockPill
                    icon="list-tree"
                    label="Subtasks"
                    count={subsTotal ? subsDone + ' / ' + subsTotal : null}
                    open={panel === 'subs'}
                    onClick={() => setPanel(panel === 'subs' ? null : 'subs')}
                  />
                </div>

                {/* The two numerals this screen exists for. */}
                <div style={{ display: 'grid', justifyItems: 'center', gap: 'var(--sp-5)', width: '100%', paddingTop: 'var(--sp-3)' }}>
                  <Countdown seconds={left} total={task.alloc * 60} running={running} size="lg" />
                  <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-5)', flexWrap: 'wrap', justifyContent: 'center' }}>
                    <Kicker tone="var(--fg-4)">
                      {over ? 'Over by ' + hms(-left) : hms(spent) + ' elapsed'}
                    </Kicker>
                    <span style={{ width: 3, height: 3, borderRadius: '50%', background: 'var(--fg-4)' }} />
                    <Kicker tone="var(--fg-4)">{mins(task.alloc)} allocated</Kicker>
                    <span style={{ display: 'flex', gap: 'var(--sp-3)' }}>
                      <Button size="sm" variant="ghost" onClick={() => extend(5)}>+5m</Button>
                      <Button size="sm" variant="ghost" onClick={() => extend(15)}>+15m</Button>
                    </span>
                  </span>
                </div>

                {/* Controls. One frost verb, one glass verb, one ghost escape. */}
                {confirmEnd ? (
                  <div style={{
                    display: 'flex', alignItems: 'center', gap: 'var(--sp-5)', flexWrap: 'wrap', justifyContent: 'center',
                    padding: 'var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-7)', borderRadius: 'var(--r-pill)',
                    backgroundImage: 'var(--glass-tint-rose)', boxShadow: 'var(--glass-rim-2)',
                    animation: 'ag-condense var(--dur-base) var(--ease-glass) both',
                  }}>
                    <span style={{ font: 'var(--type-label)', color: 'var(--fg-1)' }}>
                      End the session? {mins(sessionLeft / 60)} of the window is left.
                    </span>
                    <Button size="sm" variant="ghost" onClick={() => setConfirmEnd(false)}>Keep going</Button>
                    <Button size="sm" variant="tint" tone="rose" onClick={() => { setRunning(false); setEnded(true); }}>End session</Button>
                  </div>
                ) : (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-5)', flexWrap: 'wrap', justifyContent: 'center' }}>
                    <IconButton label="End the session" size="lg" variant="ghost" onClick={() => setConfirmEnd(true)}>
                      <Icon name="x" size={20} />
                    </IconButton>
                    <Button
                      size="lg"
                      variant="glass"
                      iconLeft={<Icon name={running ? 'pause' : 'play'} size={18} />}
                      onClick={() => setRunning(!running)}
                    >
                      {running ? 'Pause' : 'Resume'}
                    </Button>
                    <Button size="lg" variant="frost" iconLeft={<Icon name="check" size={18} />} onClick={markDone}>
                      Mark done
                    </Button>
                  </div>
                )}

                {/* Defer is a decision, so it sits a step below the controls. */}
                <div style={{ display: 'grid', justifyItems: 'center', gap: 'var(--sp-3)' }}>
                  <Button size="sm" variant="tint" tone="amber" iconLeft={<Icon name="zap" size={15} />} onClick={defer}>
                    Defer — +1 quasi-need
                  </Button>
                  {queue.length > 1 && (
                    <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)' }}>
                      Next: {queue[1].title} · {mins(queue[1].alloc)}
                    </span>
                  )}
                </div>
              </div>

              {wide && (
                <Panel
                  open={panel === 'details'}
                  title="Task details"
                  subtitle={task.title}
                  onClose={() => setPanel(null)}
                  footer={
                    <a href="task-detail.html" style={{ border: 0, justifySelf: 'start' }}>
                      <Button size="sm" variant="ghost" iconRight={<Icon name="arrow-up-right" size={15} />}>Open the full sheet</Button>
                    </a>
                  }
                >
                  <DetailsBody task={task} />
                </Panel>
              )}

              {wide && (
                <Panel
                  open={panel === 'subs'}
                  title="Subtasks"
                  subtitle={task.title}
                  onClose={() => setPanel(null)}
                >
                  <SubtasksBody task={task} onToggle={toggleSub} />
                </Panel>
              )}
            </div>
          )}

          {/* Narrow screens have no room to dock, so the panel stacks
              under the stage rather than covering it. */}
          {!wide && panel && task && !ended && (
            <div style={{
              width: '100%', display: 'grid', gap: 'var(--sp-6)', alignContent: 'start',
              padding: 'var(--pad-card)', borderRadius: 'var(--r-card-lg)',
              backgroundImage: 'var(--glass-fill-2)', boxShadow: 'var(--glass-shadow-pane)',
              animation: 'ag-condense var(--dur-base) var(--ease-glass) both',
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--sp-4)' }}>
                <h2 style={{ margin: 0, font: 'var(--type-title)', fontSize: 'var(--text-lg)', color: 'var(--fg-1)' }}>
                  {panel === 'details' ? 'Task details' : 'Subtasks'}
                </h2>
                <span style={{ flex: 1 }} />
                <IconButton label="Close panel" size="sm" variant="ghost" onClick={() => setPanel(null)}><Icon name="x" size={16} /></IconButton>
              </div>
              {panel === 'details' ? <DetailsBody task={task} /> : <SubtasksBody task={task} onToggle={toggleSub} />}
            </div>
          )}

          {/* ============ SESSION COMPLETE ============ */}
          {ended && (
            <div style={{
              width: '100%', maxWidth: 640, display: 'grid', gap: 'var(--sp-7)', justifyItems: 'center',
              padding: 'var(--sp-10) var(--pad-card-lg)', borderRadius: 'var(--r-card-lg)',
              backgroundImage: 'var(--glass-fill-2)',
              backdropFilter: 'var(--glass-bd-lg)', WebkitBackdropFilter: 'var(--glass-bd-lg)',
              boxShadow: 'var(--glass-shadow-pane), var(--glow-accent-sm)',
              animation: 'ag-condense var(--dur-slow) var(--ease-glass) both',
            }}>
              <Kicker icon="flag-triangle-right" tone="var(--accent)">Session complete</Kicker>
              <span style={{
                font: 'var(--type-numeric)', fontSize: 'var(--text-5xl)', color: 'var(--fg-1)',
                fontVariantNumeric: 'tabular-nums', lineHeight: 1, textShadow: '0 0 34px oklch(0.70 0.15 162 / 0.45)',
              }}>
                {mins(usedTotal)}
              </span>
              <span style={{ font: 'var(--type-body)', fontSize: 'var(--text-sm)', color: 'var(--fg-3)' }}>
                {log.length} of {totalTasks} tasks closed · ended {clock(9 * 60 + (WINDOW_MIN * 60 - sessionLeft) / 60)}
              </span>

              {log.length > 0 && (
                <div style={{ display: 'grid', gap: 'var(--sp-2)', width: '100%' }}>
                  {log.map((t) => (
                    <div key={t.id} style={{
                      display: 'flex', alignItems: 'center', gap: 'var(--sp-4)', minHeight: 44,
                      padding: '0 var(--sp-5)', borderRadius: 'var(--r-sm)',
                      backgroundImage: 'var(--glass-fill-1)', boxShadow: 'var(--glass-rim-1)',
                    }}>
                      <span style={{ display: 'flex', color: 'var(--accent)' }}><Icon name="check" size={15} /></span>
                      <span style={{ flex: 1, minWidth: 0, font: 'var(--type-body)', fontSize: 'var(--text-sm)', color: 'var(--fg-2)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                        {t.title}
                      </span>
                      <span style={{ font: 'var(--type-numeric)', fontSize: 'var(--text-xs)', color: 'var(--fg-3)', fontVariantNumeric: 'tabular-nums' }}>
                        {mins(t.used)}
                      </span>
                    </div>
                  ))}
                </div>
              )}

              <div style={{ display: 'flex', gap: 'var(--sp-4)', flexWrap: 'wrap', justifyContent: 'center' }}>
                <a href="home.html" style={{ border: 0, display: 'flex' }}>
                  <Button variant="ghost" iconLeft={<Icon name="house" size={16} />}>Home</Button>
                </a>
                <a href="session.html" style={{ border: 0, display: 'flex' }}>
                  <Button variant="frost" iconRight={<Icon name="arrow-right" size={16} />}>New session</Button>
                </a>
              </div>
            </div>
          )}
        </div>

        <Capture onSave={(title, list) => say('Captured.', title + ' \u2192 ' + list, 'neutral')} />

        {toast && (
          <div style={{ position: 'fixed', bottom: 'var(--sp-8)', left: '50%', transform: 'translateX(-50%)', zIndex: 90 }}>
            <Toast
              icon={<Icon name={toast.tone === 'review' ? 'zap' : toast.tone === 'neutral' ? 'arrow-down-wide-narrow' : 'check'} size={16} />}
              tone={toast.tone}
              title={toast.title}
              detail={toast.detail}
              onDismiss={() => setToast(null)}
            />
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Focus />);
});
</script>
</body>
</html>
