<!-- @dsCard group="Foundations" viewport="700x230" name="Elevation & glow" subtitle="Shadow says above; glow says emitting — never conflate them" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elevation and glow</title>
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<script src="../_ds_loader.js"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; }
  #root { min-height: 100%; }
  .row { display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap; }
  .col { display: grid; gap: var(--sp-5); }
  .pad { padding: var(--sp-7) var(--sp-8); }
  .lbl { font: var(--type-kicker); letter-spacing: var(--tracking-kicker); text-transform: uppercase; color: var(--fg-4); }
</style>
</head>
<body class="ag-page ag-page--calm">
<div class="pad col" style="gap: var(--sp-7)">
  <div>
    <span class="lbl">Shadow — height</span>
    <div class="row" style="gap: var(--sp-6); margin-top: var(--sp-5)">
      <div><div style="width:96px;height:62px;border-radius:var(--r-sm);background:var(--void-2);box-shadow:var(--shadow-1)"></div><div class="lbl" style="margin-top:8px">1</div></div>
      <div><div style="width:96px;height:62px;border-radius:var(--r-sm);background:var(--void-2);box-shadow:var(--shadow-2)"></div><div class="lbl" style="margin-top:8px">2 chip</div></div>
      <div><div style="width:96px;height:62px;border-radius:var(--r-sm);background:var(--void-2);box-shadow:var(--shadow-3)"></div><div class="lbl" style="margin-top:8px">3 card</div></div>
      <div><div style="width:96px;height:62px;border-radius:var(--r-sm);background:var(--void-2);box-shadow:var(--shadow-4)"></div><div class="lbl" style="margin-top:8px">4 popover</div></div>
      <div><div style="width:96px;height:62px;border-radius:var(--r-sm);background:var(--void-2);box-shadow:var(--shadow-5)"></div><div class="lbl" style="margin-top:8px">5 sheet</div></div>
    </div>
  </div>
  <div>
    <span class="lbl">Glow — emission, accents only</span>
    <div class="row" style="gap: var(--sp-6); margin-top: var(--sp-5)">
      <div><div style="width:96px;height:62px;border-radius:var(--r-sm);background:var(--glass-fill-2);box-shadow:var(--glow-accent-sm)"></div><div class="lbl" style="margin-top:8px">accent sm</div></div>
      <div><div style="width:96px;height:62px;border-radius:var(--r-sm);background:var(--glass-fill-2);box-shadow:var(--glow-accent-md)"></div><div class="lbl" style="margin-top:8px">accent md</div></div>
      <div><div style="width:96px;height:62px;border-radius:var(--r-sm);background:var(--glass-fill-2);box-shadow:var(--glow-accent-lg)"></div><div class="lbl" style="margin-top:8px">accent lg</div></div>
      <div><div style="width:96px;height:62px;border-radius:var(--r-sm);background:var(--glass-fill-2);box-shadow:var(--glow-rose-md)"></div><div class="lbl" style="margin-top:8px">overrun</div></div>
      <div><div style="width:96px;height:62px;border-radius:var(--r-sm);background:var(--glass-fill-2);box-shadow:var(--glow-white-sm)"></div><div class="lbl" style="margin-top:8px">white</div></div>
    </div>
  </div>
</div>
</body>
</html>
