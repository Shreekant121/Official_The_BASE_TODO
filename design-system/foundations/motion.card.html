<!-- @dsCard group="Foundations" viewport="700x300" name="Motion" subtitle="Three curves, and the rule that nothing appears from nowhere" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion</title>
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<script src="../_ds_loader.js"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; }
  #root { min-height: 100%; }
  .row { display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap; }
  .col { display: grid; gap: var(--sp-5); }
  .pad { padding: var(--sp-7) var(--sp-8); }
  .lbl { font: var(--type-kicker); letter-spacing: var(--tracking-kicker); text-transform: uppercase; color: var(--fg-4); }
</style>
</head>
<body class="ag-page ag-page--calm">
<div id="root"></div>
<script type="text/ag-jsx">
AG_LOAD(['../components/material/GlassSurface.jsx']).then(function (AG) {
  const { GlassSurface } = AG;

  function Demo() {
    const [n, setN] = React.useState(0);
    React.useEffect(() => { const t = setInterval(() => setN((v) => v + 1), 2400); return () => clearInterval(t); }, []);
    const on = n % 2 === 0;

    const curves = [
      ['ease-glass', 'cubic-bezier(.16,1,.3,1)', 'the house curve'],
      ['ease-morph', 'cubic-bezier(.32,.72,0,1)', 'shape to shape'],
      ['ease-spring', 'cubic-bezier(.34,1.56,.64,1)', 'toggles, ticks'],
    ];

    return (
      <div className="pad col" style={{ gap: 'var(--sp-7)' }}>
        <div className="col" style={{ gap: 'var(--sp-5)' }}>
          {curves.map(([name, val, use]) => (
            <div key={name} style={{ display: 'grid', gridTemplateColumns: '150px 1fr 130px', alignItems: 'center', gap: 'var(--sp-5)' }}>
              <span className="lbl">{name}</span>
              <div style={{ position: 'relative', height: 22, borderRadius: 'var(--r-pill)', backgroundImage: 'var(--glass-well)', boxShadow: 'var(--glass-well-shadow)' }}>
                <span style={{ position: 'absolute', top: 3, left: on ? 'calc(100% - 19px)' : 3, width: 16, height: 16, borderRadius: '50%', background: 'var(--accent)', boxShadow: 'var(--glow-accent-sm)', transition: 'left 900ms ' + val }} />
              </div>
              <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)' }}>{use}</span>
            </div>
          ))}
        </div>
        <div>
          <span className="lbl">Panes condense in — they never fade from nowhere</span>
          <div className="row" style={{ marginTop: 'var(--sp-4)' }}>
            <GlassSurface key={n} level={2} radius="var(--r-md)" style={{ width: 132, height: 74, animation: 'ag-condense var(--dur-base) var(--ease-glass) both' }} />
            <GlassSurface key={'b' + n} level={2} radius="var(--r-md)" style={{ width: 132, height: 74, animation: 'ag-condense var(--dur-base) var(--ease-glass) 120ms both' }} />
            <GlassSurface key={'c' + n} level={2} radius="var(--r-md)" style={{ width: 132, height: 74, animation: 'ag-condense var(--dur-base) var(--ease-glass) 240ms both' }} />
            <span style={{ font: 'var(--type-caption)', color: 'var(--fg-4)' }}>44ms stagger</span>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script>
</body>
</html>
